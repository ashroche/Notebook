<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbf8f1;
  --ink:#22262e;
  --pen-red:#cf2f27;
  --desk-1:#39342c;
  --desk-2:#191714;
  --chrome:#26241f;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(1100px 780px at 50% -8%, var(--desk-1), var(--desk-2) 72%);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  color:#e6e2da;overflow:hidden;
}

/* ---------- top bar ---------- */
.bar{position:fixed;top:0;left:0;right:0;height:48px;z-index:100;
  display:flex;align-items:center;gap:7px;padding:0 13px;
  background:linear-gradient(#14120fe0,#14120f00)}
.bar button,.bar .datewrap{
  font:inherit;font-size:13px;color:#ded9d0;background:#ffffff0d;
  border:1px solid #ffffff1a;border-radius:7px;padding:6px 11px;cursor:pointer;line-height:1}
.bar button:hover{background:#ffffff1c}
.bar button:disabled{opacity:.32;cursor:default}
.bar button:focus-visible,.bar input:focus-visible{outline:2px solid #b9d0ff;outline-offset:2px}
.nav{padding:6px 10px !important;font-size:15px !important}
.datewrap{display:flex;align-items:center;gap:8px;padding:5px 10px;position:relative}
.datewrap input{font:inherit;font-size:13px;color:#f2eee6;background:transparent;border:0;
  padding:0;color-scheme:dark;cursor:pointer}
.datelabel{font-size:13px;color:#f2eee6;white-space:nowrap}
.today-dot{width:6px;height:6px;border-radius:50%;background:var(--pen-red);flex:none}
.hidden-date{position:absolute;inset:0;opacity:0;cursor:pointer}
.spacer{flex:1}
.sep{width:1px;height:20px;background:#ffffff1a;margin:0 3px}

#syncBtn{display:flex;align-items:center;gap:7px}
.sdot{width:7px;height:7px;border-radius:50%;background:#7b756a;flex:none}
.sdot.ok{background:#57a866}
.sdot.busy{background:#d8a13c;animation:pulse 1s ease-in-out infinite}
.sdot.err{background:#cf4a3f}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ---------- stage & notebook ---------- */
.stage{position:absolute;inset:48px 0 0 0;overflow:auto;display:flex;
  justify-content:center;align-items:flex-start;padding:12px 0 0}
.notebook{position:relative;width:818px;height:1123px;flex:none;transform-origin:top center}

.cover{position:absolute;left:18px;top:-7px;width:812px;height:1139px;border-radius:3px 7px 7px 3px;
  background:linear-gradient(160deg,#413a30,#26211b);
  box-shadow:0 30px 60px rgba(0,0,0,.55), 0 6px 14px rgba(0,0,0,.4)}
.sheet{position:absolute;width:794px;height:1123px;border-radius:1px 3px 3px 1px}
.s1{left:35px;top:12px;background:#c8c2b3}
.s2{left:32px;top:8px;background:#ded9cc}
.s3{left:29px;top:4px;background:#efebe0}

.page{position:absolute;left:26px;top:0;width:794px;height:1123px;background:var(--paper);
  border-radius:1px 3px 3px 1px;box-shadow:0 2px 5px rgba(0,0,0,.35);overflow:hidden}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.06;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>")}
.gutter{position:absolute;left:0;top:0;bottom:0;width:96px;pointer-events:none;
  background:linear-gradient(90deg, rgba(74,56,30,.17), rgba(74,56,30,.04) 46%, transparent)}
.topfade{position:absolute;left:0;right:0;top:0;height:26px;pointer-events:none;
  background:linear-gradient(rgba(74,56,30,.10),transparent)}

.holes{position:absolute;left:0;top:0;bottom:0;width:100px;pointer-events:none;z-index:3}
.hole{position:absolute;left:34px;width:14px;height:14px;border-radius:50%;
  background:radial-gradient(circle at 50% 30%, #35302a, #17140f 70%);
  box-shadow:inset 0 2px 3px rgba(0,0,0,.85), 0 1px 0 rgba(255,255,255,.6)}
.spiral{position:absolute;left:0;top:0;width:818px;height:1123px;pointer-events:none;z-index:6}
.wire{fill:none;stroke:url(#wiregrad);stroke-width:5.4;stroke-linecap:round}
.wireshade{fill:none;stroke:rgba(0,0,0,.17);stroke-width:7.4;stroke-linecap:round}

/* ---------- writing area ---------- */
.canvas{position:absolute;left:100px;top:34px;right:32px;bottom:32px;z-index:4}
.hint{position:absolute;left:6px;top:8px;font-family:'Caveat',cursive;font-size:27px;
  color:rgba(0,0,0,.17);pointer-events:none;user-select:none;line-height:1.35}

.block{position:absolute;color:var(--ink)}
.block.sel{outline:1px dashed rgba(0,0,0,.20);outline-offset:7px;border-radius:2px}
.row{display:flex;align-items:flex-start;position:relative}

.tick{position:absolute;display:flex;align-items:center;justify-content:center;
  cursor:pointer;border-radius:5px}
.tick:hover{background:rgba(207,47,39,.10)}
/* while a block is being edited its ticks step aside, so clicking past the end of a
   line puts the cursor there instead of striking the line off. Ctrl+Enter still works. */
.block:focus-within .tick{pointer-events:none}
.block:focus-within .tick .ghost{opacity:0}
.tick svg{width:100%;height:100%;overflow:visible}
.tick .ghost{opacity:0;transition:opacity .12s}
.row:hover .tick .ghost{opacity:.22}
.tick:hover .ghost{opacity:.45}
.tick .ghost path{fill:none;stroke:#2a2a2a;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.tick .real path{fill:none;stroke:var(--pen-red);stroke-linecap:round;stroke-linejoin:round}

.bul{position:absolute;pointer-events:none}
.bul svg{display:block;overflow:visible}
.bul path{fill:var(--ink);opacity:.85}

.tx{flex:1;min-height:1.3em;outline:none;white-space:pre-wrap;overflow-wrap:break-word;
  line-height:1.3;padding-right:2px}

.strike{position:absolute;left:0;top:0;width:100%;height:100%;
  pointer-events:none;overflow:visible}
.strike path{fill:none;stroke:var(--pen-red);stroke-linecap:round;opacity:.93}

.grip{position:absolute;top:-21px;left:0;height:21px;display:none;align-items:center;gap:2px}
.block:hover .grip,.block.sel .grip{display:flex}
.dots{width:36px;height:13px;border-radius:3px;cursor:grab;
  background-image:radial-gradient(rgba(0,0,0,.34) 1px, transparent 1.1px);
  background-size:5px 5px;background-position:1px 2px}
.dots:active{cursor:grabbing}
.del{border:0;background:transparent;color:rgba(0,0,0,.32);cursor:pointer;
  font-size:16px;line-height:1;padding:0 5px;font-family:inherit}
.del:hover{color:var(--pen-red)}
.resize{position:absolute;top:0;right:-7px;width:12px;height:100%;cursor:ew-resize;display:none}
.block:hover .resize,.block.sel .resize{display:block}
.resize::after{content:'';position:absolute;top:50%;right:4px;width:3px;height:28px;
  margin-top:-14px;border-radius:2px;background:rgba(0,0,0,.15)}

/* ---------- floating toolbar ---------- */
.toolbar{position:fixed;z-index:200;display:none;align-items:center;gap:3px;
  background:var(--chrome);border:1px solid #ffffff20;border-radius:9px;padding:5px 6px;
  box-shadow:0 10px 30px rgba(0,0,0,.55)}
.toolbar.on{display:flex}
.toolbar select,.toolbar button{font:inherit;font-size:12px;color:#e4dfd6;background:transparent;
  border:0;border-radius:6px;padding:5px 8px;cursor:pointer;line-height:1}
.toolbar select{color-scheme:dark;padding:4px 4px}
.toolbar option{background:#26241f;color:#e4dfd6}
.toolbar button:hover,.toolbar select:hover{background:#ffffff18}
.toolbar button.act{background:#ffffff26;color:#fff}
.toolbar .size{font-size:12px;min-width:20px;text-align:center;color:#bdb7ad;user-select:none}
.toolbar .sep{width:1px;height:17px;background:#ffffff1f;margin:0 3px}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:400;display:none;align-items:center;justify-content:center;
  background:rgba(10,9,7,.66)}
.modal.on{display:flex}
.card{width:430px;max-width:92vw;background:#211f1b;border:1px solid #ffffff1c;
  border-radius:13px;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.card h2{margin:0 0 6px;font-size:16px;font-weight:600;color:#f0ece3}
.card p{margin:0 0 16px;font-size:12.5px;line-height:1.55;color:#a8a297}
.card label{display:block;font-size:11.5px;color:#a8a297;margin:12px 0 5px}
.card input{width:100%;font:inherit;font-size:13px;color:#f0ece3;background:#15130f;
  border:1px solid #ffffff1c;border-radius:7px;padding:9px 10px}
.card input:focus{outline:2px solid #b9d0ff;outline-offset:1px}
.card .acts{display:flex;gap:8px;margin-top:20px;align-items:center}
.card button{font:inherit;font-size:12.5px;color:#ded9d0;background:#ffffff0d;
  border:1px solid #ffffff1a;border-radius:7px;padding:8px 13px;cursor:pointer}
.card button:hover{background:#ffffff1c}
.card button.primary{background:#3d6b46;border-color:#4c8257;color:#eaf5ec}
.card button.primary:hover{background:#487a52}
.card button.quiet{background:transparent;border-color:transparent;color:#8e887d}
.card .note{font-size:11.5px;color:#8e887d;margin-top:12px;line-height:1.5}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--chrome);
  border:1px solid #ffffff20;color:#e6e1d8;padding:9px 16px;border-radius:22px;font-size:13px;
  z-index:300;opacity:0;pointer-events:none;transition:opacity .18s;max-width:70vw;text-align:center}
.toast.on{opacity:1}

@media (prefers-reduced-motion: reduce){
  .strike path,.tick .real path{transition:none !important}
  .toast{transition:none}
  .sdot.busy{animation:none}
}
</style>
</head>
<body>

<div class="bar">
  <button class="nav" id="prev" title="Previous day (Alt+Left)">&lsaquo;</button>
  <span class="datewrap">
    <span class="today-dot" id="dot" style="display:none"></span>
    <span class="datelabel" id="datelabel">&nbsp;</span>
    <input type="date" id="dateinput" class="hidden-date" aria-label="Go to date">
  </span>
  <button class="nav" id="next" title="Next day (Alt+Right)">&rsaquo;</button>
  <button id="todayBtn">Today</button>
  <span class="sep"></span>
  <button id="carry" title="Bring unticked items forward from your last written page">Carry forward</button>
  <span class="spacer"></span>
  <button id="zoomBtn" title="Switch between fit-to-window and true A4 size">Fit</button>
  <button id="syncBtn" title="Cloud sync"><span class="sdot" id="sdot"></span><span id="slabel">Sync off</span></button>
  <span class="sep"></span>
  <button id="undoBtn" title="Undo (Ctrl+Z)">Undo</button>
  <button id="redoBtn" title="Redo (Ctrl+Shift+Z)">Redo</button>
</div>

<div class="stage" id="stage">
  <div class="notebook" id="notebook">
    <div class="cover"></div>
    <div class="sheet s1"></div><div class="sheet s2"></div><div class="sheet s3"></div>
    <div class="page" id="page">
      <div class="gutter"></div>
      <div class="topfade"></div>
      <div class="grain"></div>
      <div class="holes" id="holes"></div>
      <div class="canvas" id="canvas"><div class="hint" id="hint">double-click anywhere to write<br>hover a line and click the tick at the end</div></div>
    </div>
    <svg class="spiral" id="spiral" viewBox="0 0 818 1123" aria-hidden="true"></svg>
  </div>
</div>

<div class="toolbar" id="toolbar">
  <select id="tbFont" aria-label="Font">
    <option value="hand">Handwriting</option>
    <option value="sans">Sans</option>
    <option value="serif">Serif</option>
  </select>
  <span class="sep"></span>
  <button id="tbMinus" aria-label="Smaller">&minus;</button>
  <span class="size" id="tbSize">17</span>
  <button id="tbPlus" aria-label="Bigger">+</button>
  <span class="sep"></span>
  <button id="tbB" aria-label="Bold" title="Bold (Ctrl+B)"><b>B</b></button>
  <button id="tbI" aria-label="Italic" title="Italic (Ctrl+I)"><i>I</i></button>
  <button id="tbU" aria-label="Underline" title="Underline (Ctrl+U)"><u>U</u></button>
  <button id="tbL" aria-label="Bullet" title="Bullet (Ctrl+Shift+8)">&bull;</button>
</div>

<div class="modal" id="modal">
  <div class="card">
    <h2>Cloud sync</h2>
    <p>Saves your pages to a JSONBin bin so you can open this notebook on another device. Your key is kept in this browser only and is never sent anywhere except JSONBin.</p>
    <label for="mkey">JSONBin master key</label>
    <input type="password" id="mkey" autocomplete="off" spellcheck="false" placeholder="$2a$10$...">
    <label for="mbin">Bin ID</label>
    <input type="text" id="mbin" autocomplete="off" spellcheck="false" placeholder="Paste one, or create a new bin below">
    <div class="acts">
      <button id="mkbin">Create a new bin</button>
      <span class="spacer"></span>
      <button class="quiet" id="mDisc">Disconnect</button>
      <button id="mCancel">Cancel</button>
      <button class="primary" id="mSave">Save</button>
    </div>
    <div class="note" id="mNote"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

/* ================= constants ================= */
var NB_W=818, NB_H=1123;
var FONTS={hand:"'Caveat','Bradley Hand',cursive",sans:"'Inter',system-ui,sans-serif",serif:"'Lora',Georgia,serif"};
/* Caveat has a small x-height, so it needs ~1.55x the px size of Inter to look the same
   size on the page. Sizes shown in the toolbar are apparent size, not raw CSS px. */
var FSCALE={hand:1.55,sans:1,serif:1};
var DEF_SIZE=17, MIN_SIZE=11, MAX_SIZE=40;
var KEY='notebook-v1-pages';
var K_APIKEY='checklist-apikey';   /* shared with the checklist apps on this origin */
var K_BIN='notebook-binid';
var K_ZOOM='notebook-zoom';
var MIN_W=120, DEF_W=300;
var API='https://api.jsonbin.io/v3/b';

var canvas=document.getElementById('canvas');
var hint=document.getElementById('hint');
var nb=document.getElementById('notebook');
var stage=document.getElementById('stage');
var tb=document.getElementById('toolbar');
var toast=document.getElementById('toast');
var modal=document.getElementById('modal');

var pages={}, cur=todayISO();
var selId=null, zTop=1, scale=1, zoom='fit';
var undoS=[], redoS=[], typing=false, typingT=null;
var lastLine=null, animSet={}, animT=null;
var lastEdit=0;

/* ================= helpers ================= */
function uid(){ return Math.random().toString(36).slice(2,9); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function hash(s){ var h=2166136261; for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=(h*16777619)>>>0; } return h>>>0; }
function pad(n){ return String(n).padStart(2,'0'); }
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function shiftISO(iso,n){ var p=iso.split('-'); var d=new Date(+p[0],+p[1]-1,+p[2]); d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fmtLong(iso){ var p=iso.split('-'); return new Date(+p[0],+p[1]-1,+p[2])
  .toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'}); }
function fmtShort(iso){ var p=iso.split('-'); return new Date(+p[0],+p[1]-1,+p[2])
  .toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'}); }
function pg(d){ d=d||cur; if(!pages[d]) pages[d]={blocks:[]}; return pages[d]; }
function findBlock(id){ var b=pg().blocks; for(var i=0;i<b.length;i++) if(b[i].id===id) return b[i]; return null; }
function lineIndex(b,lid){ for(var i=0;i<b.lines.length;i++) if(b.lines[i].id===lid) return i; return -1; }
function px(b){ return b.size*(FSCALE[b.font]||1); }
function say(msg){ toast.textContent=msg; toast.classList.add('on');
  clearTimeout(say._t); say._t=setTimeout(function(){toast.classList.remove('on');},2800); }

/* ================= storage ================= */
function writeLocal(){
  try{ localStorage.setItem(KEY, JSON.stringify({v:2,pages:pages})); }
  catch(e){ say('Could not save locally. Browser storage may be full.'); }
}
function load(){
  var raw=null;
  try{ raw=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!raw||typeof raw!=='object'){ pages={}; return; }
  if(raw.v===2 && raw.pages){ pages=raw.pages; normalise(); return; }
  pages = raw.pages || raw;               /* v1: bare map, sizes stored as raw px */
  for(var d in pages){
    var p=pages[d];
    if(!p||!p.blocks){ delete pages[d]; continue; }
    for(var i=0;i<p.blocks.length;i++){
      var b=p.blocks[i];
      if(b.font==='hand' && b.size>=20) b.size=Math.round(b.size/FSCALE.hand);
      b.size=clamp(b.size||DEF_SIZE,MIN_SIZE,MAX_SIZE);
    }
    p.u=p.u||Date.now();
  }
  normalise(); writeLocal();
}
function normalise(){
  for(var d in pages){
    var p=pages[d];
    if(!p||!Array.isArray(p.blocks)){ delete pages[d]; continue; }
    for(var i=0;i<p.blocks.length;i++){
      var b=p.blocks[i];
      if(!Array.isArray(b.lines)||!b.lines.length){ p.blocks.splice(i--,1); continue; }
      for(var j=0;j<b.lines.length;j++){ var l=b.lines[j]; if(l.bul===undefined) l.bul=false; }
    }
  }
}
function prune(){
  for(var d in pages){
    var p=pages[d];
    if((!p.blocks||!p.blocks.length) && !p.u) delete pages[d];
  }
}
function save(){
  pg().u=Date.now(); lastEdit=Date.now();
  prune(); writeLocal(); pushSoon();
}

/* ================= undo ================= */
function snap(){ return JSON.stringify(pg().blocks); }
function pushUndo(){ undoS.push(snap()); if(undoS.length>80) undoS.shift(); redoS.length=0; refreshUndo(); }
function undo(){ if(!undoS.length) return; redoS.push(snap());
  pg().blocks=JSON.parse(undoS.pop()); if(!findBlock(selId)) selId=null;
  save(); render(false); refreshUndo(); }
function redo(){ if(!redoS.length) return; undoS.push(snap());
  pg().blocks=JSON.parse(redoS.pop()); if(!findBlock(selId)) selId=null;
  save(); render(false); refreshUndo(); }
function refreshUndo(){
  document.getElementById('undoBtn').disabled=!undoS.length;
  document.getElementById('redoBtn').disabled=!redoS.length;
}

/* ================= notebook furniture ================= */
function buildFurniture(){
  var holes=document.getElementById('holes'), spiral=document.getElementById('spiral');
  var start=30, gap=32, hh='', sv='';
  sv+='<defs><linearGradient id="wiregrad" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0" stop-color="#fdfdfc"/><stop offset="0.20" stop-color="#dedcd7"/>'+
      '<stop offset="0.50" stop-color="#a4a29c"/><stop offset="0.76" stop-color="#75736d"/>'+
      '<stop offset="1" stop-color="#56544f"/></linearGradient></defs>';
  for(var y=start;y<NB_H-26;y+=gap){
    hh+='<div class="hole" style="top:'+(y-7)+'px"></div>';
    var hx=26+41;
    sv+='<path class="wireshade" d="M 11 '+(y+15)+' C 12 '+(y-4)+' 40 '+(y-8)+' '+hx+' '+(y+3)+'"/>';
    sv+='<path class="wire" d="M 11 '+(y+12)+' C 12 '+(y-7)+' 40 '+(y-11)+' '+hx+' '+y+'"/>';
  }
  holes.innerHTML=hh; spiral.innerHTML=sv;
}

function fit(){
  if(zoom==='full'){ scale=1; }
  else {
    var availH=window.innerHeight-48-40, availW=window.innerWidth-30;
    scale=clamp(Math.min(availH/NB_H, availW/NB_W),0.30,1);
  }
  nb.style.transform='scale('+scale+')';
  nb.style.marginBottom = (-(NB_H*(1-scale))+28)+'px';
  document.getElementById('zoomBtn').textContent = (zoom==='full')?'A4':'Fit';
  placeToolbar(); layoutMarks();
}

/* ================= pen marks ================= */
function tickSVG(seed,real){
  var r=hash(seed);
  function n(i,a){ return ((((r>>(i*4))&15)/15)-0.5)*2*a; }
  var rot=n(0,5.5), sc=0.92+((r>>3)%20)/100;
  var cx=(7.8+n(7,0.5)), cy=(18.7+n(1,0.9));
  var down='M '+(3.2+n(1,0.8)).toFixed(1)+' '+(12.0+n(2,1.0)).toFixed(1)+
           ' C '+(4.9+n(3,0.6)).toFixed(1)+' '+(13.7+n(4,0.7)).toFixed(1)+
           ' '+(6.2+n(5,0.6)).toFixed(1)+' '+(15.6+n(6,0.7)).toFixed(1)+
           ' '+cx.toFixed(1)+' '+cy.toFixed(1);
  var up='M '+cx.toFixed(1)+' '+cy.toFixed(1)+
         ' C '+(11.2+n(2,0.9)).toFixed(1)+' '+(12.1+n(3,1.0)).toFixed(1)+
         ' '+(15.5+n(4,1.0)).toFixed(1)+' '+(6.2+n(5,1.1)).toFixed(1)+
         ' '+(21.2+n(6,0.9)).toFixed(1)+' '+(1.8+n(7,1.0)).toFixed(1);
  var w=(2.3+n(0,0.5)).toFixed(2);
  var st=real?' style="stroke-width:'+w+'"':'';
  return '<svg class="'+(real?'real':'ghost')+'" viewBox="0 0 24 24" preserveAspectRatio="xMidYMid meet" '+
    'style="transform:rotate('+rot.toFixed(1)+'deg) scale('+sc.toFixed(2)+')">'+
    '<path d="'+down+'"'+st+'/><path d="'+up+'"'+st+'/></svg>';
}

function bulletSVG(seed,size){
  var r=hash(seed+'b');
  function n(i,a){ return ((((r>>(i*4))&15)/15)-0.5)*2*a; }
  var rad=size*0.115, rx=rad*(1+n(0,0.22)), ry=rad*(1+n(1,0.22));
  var rot=n(2,40);
  var d='M '+(-rx).toFixed(2)+' 0 C '+(-rx).toFixed(2)+' '+(-ry*1.35).toFixed(2)+
        ' '+(rx).toFixed(2)+' '+(-ry*1.35).toFixed(2)+' '+(rx).toFixed(2)+' 0'+
        ' C '+(rx).toFixed(2)+' '+(ry*1.35).toFixed(2)+
        ' '+(-rx).toFixed(2)+' '+(ry*1.35).toFixed(2)+' '+(-rx).toFixed(2)+' 0 Z';
  var s=(rad*3).toFixed(1);
  return '<svg width="'+s+'" height="'+s+'" viewBox="'+(-rad*1.5)+' '+(-rad*1.5)+' '+(rad*3)+' '+(rad*3)+'"'+
    ' style="transform:rotate('+rot.toFixed(0)+'deg)"><path d="'+d+'"/></svg>';
}

function strikePaths(x1,x2,y,seed,fs,ln){
  var r=hash(seed);
  function n(i,a){ return ((((r>>(i*4))&15)/15)-0.5)*2*a; }
  var w=clamp(fs*0.125,1.7,3.4)+n(7,0.35);
  var o1=3+((r>>2)&7)*0.6, o2=3+((r>>5)&7)*0.7;
  var sx=x1-o1, ex=x2+o2, span=ex-sx;
  var d='M '+sx.toFixed(1)+' '+(y+n(0,1.5)).toFixed(1)+
        ' C '+(sx+span*0.32).toFixed(1)+' '+(y+n(2,2.1)-0.7).toFixed(1)+
        ' '+(sx+span*0.68).toFixed(1)+' '+(y+n(3,2.1)+0.7).toFixed(1)+
        ' '+ex.toFixed(1)+' '+(y+n(1,1.5)).toFixed(1);
  var out='<path data-ln="'+ln+'" d="'+d+'" style="stroke-width:'+w.toFixed(2)+'"/>';
  if((((r>>11)&3)===0) && span>26){
    var s2=sx+span*0.14, e2=sx+span*0.82;
    out+='<path data-ln="'+ln+'" d="M '+s2.toFixed(1)+' '+(y+n(4,1.7)).toFixed(1)+
         ' Q '+((s2+e2)/2).toFixed(1)+' '+(y+n(5,2.3)).toFixed(1)+
         ' '+e2.toFixed(1)+' '+(y+n(6,1.7)).toFixed(1)+
         '" style="stroke-width:'+(w*0.78).toFixed(2)+';opacity:.5"/>';
  }
  return out;
}

/* Measures the advance width of a single space in whatever font a line is using,
   so the tick can sit exactly one space past the last character. */
var _mctx=null, _mcache={};
function spaceWidth(el){
  var cs=getComputedStyle(el);
  var f=cs.fontStyle+' '+cs.fontWeight+' '+cs.fontSize+' '+cs.fontFamily;
  if(_mcache[f]!==undefined) return _mcache[f];
  if(!_mctx) _mctx=document.createElement('canvas').getContext('2d');
  _mctx.font=f;
  var w=_mctx.measureText(' ').width;
  if(!w||!isFinite(w)) w=(parseFloat(cs.fontSize)||17)*0.28;
  _mcache[f]=w; return w;
}

/* getClientRects can hand back several boxes for one visual line, which would draw
   several overlapping strikes. Merge anything sharing a baseline into one span. */
function lineRects(tx,base){
  var node=tx.firstChild;
  if(!node||!node.textContent) return [];
  var rng=document.createRange(); rng.selectNodeContents(tx);
  var rects=rng.getClientRects(), groups=[];
  for(var i=0;i<rects.length;i++){
    var r=rects[i];
    if(r.width<0.5||r.height<0.5) continue;
    var hit=null;
    for(var g=0;g<groups.length;g++){
      if(Math.abs(groups[g].top-r.top)<=Math.max(2,r.height*0.4)){ hit=groups[g]; break; }
    }
    if(hit){
      hit.left=Math.min(hit.left,r.left); hit.right=Math.max(hit.right,r.right);
      hit.top=Math.min(hit.top,r.top); hit.height=Math.max(hit.height,r.height);
    } else groups.push({left:r.left,right:r.right,top:r.top,height:r.height});
  }
  groups.sort(function(a,b){ return a.top-b.top; });
  var out=[];
  for(var k=0;k<groups.length;k++){
    out.push({x1:(groups[k].left-base.left)/scale, x2:(groups[k].right-base.left)/scale,
              y:(groups[k].top-base.top)/scale, h:groups[k].height/scale});
  }
  return out;
}

/* Where the pen would end up: just past the last character of the last visual row. */
function endOfText(row){
  var tx=row.querySelector('.tx');
  var base=row.getBoundingClientRect();
  var cs=getComputedStyle(tx);
  var fs=parseFloat(cs.fontSize)||17;
  var rs=lineRects(tx,base);
  if(!rs.length){
    var tr=tx.getBoundingClientRect();
    return {x:(tr.left-base.left)/scale+(parseFloat(cs.paddingLeft)||0),
            y:(tr.top-base.top)/scale, h:fs*1.3, fs:fs};
  }
  var last=rs[rs.length-1];
  /* one space, plus enough to clear the overshoot at the end of the strike stroke */
  return {x:last.x2+spaceWidth(tx)+fs*0.20, y:last.y, h:last.h, fs:fs};
}

function drawNow(paths){
  for(var i=0;i<paths.length;i++){
    var L=paths[i].getTotalLength();
    paths[i].style.transition='none';
    paths[i].style.strokeDasharray=L;
    paths[i].style.strokeDashoffset=0;
  }
}
function drawIn(paths,timings){
  for(var i=0;i<paths.length;i++){
    var L=paths[i].getTotalLength();
    paths[i].style.transition='none';
    paths[i].style.strokeDasharray=L;
    paths[i].style.strokeDashoffset=L;
  }
  requestAnimationFrame(function(){ requestAnimationFrame(function(){
    for(var i=0;i<paths.length;i++){
      var t=timings[Math.min(i,timings.length-1)];
      paths[i].style.transition='stroke-dashoffset '+t.d+'s '+t.e+' '+t.w+'s';
      paths[i].style.strokeDashoffset='0';
    }
  });});
}

var EASE_STRIKE='cubic-bezier(.3,.65,.35,1)';
var EASE_DOWN='cubic-bezier(.42,.08,.5,1)';
var EASE_UP='cubic-bezier(.25,.55,.4,1)';

function layoutMarks(only){
  var rows=only?[only]:canvas.querySelectorAll('.row');
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  for(var i=0;i<rows.length;i++){
    var row=rows[i];
    var old=row.querySelector('.strike'); if(old) old.parentNode.removeChild(old);
    var tick=row.querySelector('.tick');
    var done=row.classList.contains('done');
    var anim=row.classList.contains('anim')&&!reduce;
    var e=endOfText(row);

    /* park the tick one space past the last character, vertically centred on that row */
    if(tick){
      var box=e.fs*1.05;
      var ink=box*0.128;                       /* the glyph starts ~13% into its own box */
      tick.style.width=box+'px';
      tick.style.height=box+'px';
      tick.style.left=(e.x-ink)+'px';
      tick.style.top=(e.y+e.h/2-box/2+e.fs*0.05)+'px';
    }

    var strikeDur=0;
    if(done){
      var tx=row.querySelector('.tx');
      var rs=lineRects(tx,row.getBoundingClientRect());
      var fs2=parseFloat(getComputedStyle(tx).fontSize)||17, paths='';
      for(var k=0;k<rs.length;k++){
        paths+=strikePaths(rs[k].x1,rs[k].x2,rs[k].y+rs[k].h*0.545,row.dataset.lid+'#'+k,fs2,k);
      }
      if(paths){
        var svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
        svg.setAttribute('class','strike');
        svg.innerHTML=paths;
        row.insertBefore(svg,row.firstChild);
        var sp=svg.querySelectorAll('path');
        strikeDur=0.30+0.085*(rs.length-1);
        if(anim){
          var st=[];
          for(var q=0;q<sp.length;q++) st.push({d:0.30,e:EASE_STRIKE,w:(+sp[q].getAttribute('data-ln')||0)*0.085});
          drawIn(sp,st);
        } else drawNow(sp);
      }
    }

    /* the tick lands after the strike, down-stroke then up-stroke */
    if(tick){
      var real=tick.querySelectorAll('.real path');
      if(real.length){
        if(anim&&done){
          drawIn(real,[{d:0.10,e:EASE_DOWN,w:strikeDur+0.07},
                       {d:0.19,e:EASE_UP,  w:strikeDur+0.16}]);
        } else drawNow(real);
      }
    }
  }
}
function markAnim(lid){
  animSet[lid]=1;
  clearTimeout(animT);
  animT=setTimeout(function(){
    animSet={};
    var a=canvas.querySelectorAll('.row.anim');
    for(var i=0;i<a.length;i++) a[i].classList.remove('anim');
  },900);
}

/* ================= rendering ================= */
function renderLine(b,l){
  var size=px(b);
  var row=document.createElement('div');
  row.className='row'+(l.done?' done':'')+(animSet[l.id]?' anim':'');
  row.dataset.lid=l.id;

  var tick=document.createElement('div');
  tick.className='tick';
  tick.title=l.done?'Click to undo':'Click to strike off';
  tick.innerHTML=l.done?tickSVG(l.id,true):tickSVG(l.id,false);
  row.appendChild(tick);

  if(l.bul){
    var bl=document.createElement('div');
    bl.className='bul';
    bl.style.left=(size*0.16)+'px';
    bl.style.top=(size*1.3/2 - size*0.1725)+'px';
    bl.innerHTML=bulletSVG(l.id,size);
    row.appendChild(bl);
  }

  var tx=document.createElement('div');
  tx.className='tx'; tx.contentEditable='true'; tx.spellcheck=false;
  tx.setAttribute('draggable','false');
  tx.textContent=l.text;
  if(l.bul) tx.style.paddingLeft=(size*0.62)+'px';
  tx.style.fontWeight=l.b?'700':'400';
  tx.style.fontStyle=l.i?'italic':'normal';
  tx.style.textDecoration=l.u?'underline':'none';
  row.appendChild(tx);
  return row;
}

function renderBlock(b){
  var el=document.createElement('div');
  el.className='block'+(b.id===selId?' sel':'');
  el.dataset.id=b.id;
  el.style.left=b.x+'px'; el.style.top=b.y+'px'; el.style.width=b.w+'px';
  el.style.fontFamily=FONTS[b.font]||FONTS.hand;
  el.style.fontSize=px(b)+'px';
  el.style.zIndex=b.z||1;

  var grip=document.createElement('div'); grip.className='grip';
  var dots=document.createElement('div'); dots.className='dots'; dots.title='Drag to move';
  var del=document.createElement('button'); del.className='del'; del.type='button';
  del.textContent='\u00d7'; del.title='Delete block';
  grip.appendChild(dots); grip.appendChild(del); el.appendChild(grip);

  var lines=document.createElement('div'); lines.className='lines';
  for(var i=0;i<b.lines.length;i++) lines.appendChild(renderLine(b,b.lines[i]));
  el.appendChild(lines);

  var rz=document.createElement('div'); rz.className='resize'; rz.title='Drag to resize';
  el.appendChild(rz);
  return el;
}

function focusRef(){
  var a=document.activeElement;
  if(!a||!a.classList||!a.classList.contains('tx')) return null;
  var row=a.closest('.row'), blk=a.closest('.block');
  if(!row||!blk) return null;
  return {bid:blk.dataset.id,lid:row.dataset.lid,pos:caretPos(a)};
}

function render(keepFocus){
  var f=(keepFocus===false)?null:focusRef();
  var frag=document.createDocumentFragment(), blocks=pg().blocks;
  for(var i=0;i<blocks.length;i++) frag.appendChild(renderBlock(blocks[i]));
  canvas.innerHTML=''; canvas.appendChild(hint); canvas.appendChild(frag);
  hint.style.display=blocks.length?'none':'block';
  if(f) focusLine(f.bid,f.lid,f.pos);
  layoutMarks(); placeToolbar();
}

/* ================= caret ================= */
function caretPos(el){
  var s=window.getSelection();
  if(!s||!s.rangeCount||!el.contains(s.anchorNode)) return 0;
  var r=s.getRangeAt(0).cloneRange(), m=document.createRange();
  m.selectNodeContents(el); m.setEnd(r.endContainer,r.endOffset);
  return m.toString().length;
}
function collapsed(){ var s=window.getSelection(); return !s||s.isCollapsed; }
function focusLine(bid,lid,pos){
  var el=canvas.querySelector('.block[data-id="'+bid+'"] .row[data-lid="'+lid+'"] .tx');
  if(!el) return;
  el.focus();
  var node=el.firstChild;
  if(!node){ node=document.createTextNode(''); el.appendChild(node); }
  var r=document.createRange();
  r.setStart(node,clamp(pos,0,node.length||0)); r.collapse(true);
  var s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
}
function atEdgeRow(el,top){
  var s=window.getSelection();
  if(!s||!s.rangeCount) return true;
  var rects=s.getRangeAt(0).getClientRects();
  var cr=rects.length?rects[0]:el.getBoundingClientRect();
  var er=el.getBoundingClientRect();
  var lh=(parseFloat(getComputedStyle(el).lineHeight)||20);
  return top ? (cr.top-er.top)<lh*0.6 : (er.bottom-cr.bottom)<lh*0.6;
}

/* ================= block ops ================= */
function newBlock(x,y){
  return {id:uid(),x:x,y:y,w:DEF_W,font:'hand',size:DEF_SIZE,z:++zTop,
          lines:[{id:uid(),text:'',b:false,i:false,u:false,bul:false,done:false}]};
}
function addBlock(x,y){
  pushUndo();
  var b=newBlock(Math.round(clamp(x-6,0,Math.max(0,canvas.clientWidth-DEF_W))),
                 Math.round(clamp(y-8,0,canvas.clientHeight-40)));
  pg().blocks.push(b); selId=b.id;
  save(); render(false); focusLine(b.id,b.lines[0].id,0);
}
function deleteBlock(id){
  var bl=pg().blocks;
  for(var i=0;i<bl.length;i++) if(bl[i].id===id){ bl.splice(i,1); break; }
  if(selId===id) selId=null;
  save(); render(false);
}
function selectBlock(id){
  if(selId===id){ placeToolbar(); return; }
  var prev=canvas.querySelector('.block.sel'); if(prev) prev.classList.remove('sel');
  selId=id;
  var b=findBlock(id), el=canvas.querySelector('.block[data-id="'+id+'"]');
  if(b&&el){ b.z=++zTop; el.style.zIndex=b.z; el.classList.add('sel'); save(); }
  placeToolbar();
}
function deselect(){
  var prev=canvas.querySelector('.block.sel'); if(prev) prev.classList.remove('sel');
  selId=null; lastLine=null; tb.classList.remove('on');
}
function currentLine(){
  if(!lastLine) return null;
  var b=findBlock(lastLine.bid); if(!b) return null;
  var i=lineIndex(b,lastLine.lid);
  return i<0?null:b.lines[i];
}
function updateToolbar(){
  var b=findBlock(selId); if(!b){ tb.classList.remove('on'); return; }
  document.getElementById('tbFont').value=b.font;
  document.getElementById('tbSize').textContent=b.size;
  var l=currentLine();
  document.getElementById('tbB').classList.toggle('act',!!(l&&l.b));
  document.getElementById('tbI').classList.toggle('act',!!(l&&l.i));
  document.getElementById('tbU').classList.toggle('act',!!(l&&l.u));
  document.getElementById('tbL').classList.toggle('act',!!(l&&l.bul));
}
function placeToolbar(){
  var b=findBlock(selId); if(!b){ tb.classList.remove('on'); return; }
  var el=canvas.querySelector('.block[data-id="'+b.id+'"]');
  if(!el){ tb.classList.remove('on'); return; }
  tb.classList.add('on'); updateToolbar();
  var r=el.getBoundingClientRect();
  var tw=tb.offsetWidth||300, th=tb.offsetHeight||34;
  var left=clamp(r.left+r.width/2-tw/2,8,window.innerWidth-tw-8);
  var top=r.top-th-14; if(top<54) top=r.bottom+14;
  tb.style.left=left+'px'; tb.style.top=top+'px';
}

/* ================= mouse ================= */
canvas.addEventListener('dblclick',function(e){
  if(e.target!==canvas) return;
  addBlock(e.offsetX,e.offsetY);
});

canvas.addEventListener('mousedown',function(e){
  var blk=e.target.closest?e.target.closest('.block'):null;
  if(!blk){ if(e.target===canvas) deselect(); return; }
  var b=findBlock(blk.dataset.id); if(!b) return;

  if(e.target.classList.contains('dots')||(e.altKey&&!e.target.classList.contains('resize'))){
    e.preventDefault(); selectBlock(b.id); startDrag(e,b); return;
  }
  if(e.target.classList.contains('resize')){
    e.preventDefault(); selectBlock(b.id); startResize(e,b); return;
  }
  if(e.target.classList.contains('del')){
    e.preventDefault(); pushUndo(); deleteBlock(b.id); return;
  }
  var tickEl=e.target.closest('.tick');
  if(tickEl){
    e.preventDefault();
    var lid=tickEl.closest('.row').dataset.lid;
    var i=lineIndex(b,lid); if(i<0) return;
    pushUndo();
    b.lines[i].done=!b.lines[i].done;
    if(b.lines[i].done) markAnim(lid);
    selId=b.id; save(); render();
    return;
  }
  selectBlock(b.id);
  if(e.target===blk||e.target.classList.contains('lines')){
    e.preventDefault();
    var last=b.lines[b.lines.length-1];
    focusLine(b.id,last.id,last.text.length);
  }
});

function startDrag(e,b){
  var sx=e.clientX, sy=e.clientY, ox=b.x, oy=b.y, moved=false;
  var el=canvas.querySelector('.block[data-id="'+b.id+'"]');
  function mv(ev){
    if(!moved){ pushUndo(); moved=true; }
    b.x=Math.round(clamp(ox+(ev.clientX-sx)/scale,0,Math.max(0,canvas.clientWidth-b.w)));
    b.y=Math.round(clamp(oy+(ev.clientY-sy)/scale,0,Math.max(0,canvas.clientHeight-24)));
    el.style.left=b.x+'px'; el.style.top=b.y+'px'; placeToolbar();
  }
  function up(){ document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up);
    if(moved) save(); }
  document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up);
}
function startResize(e,b){
  var sx=e.clientX, ow=b.w, moved=false;
  var el=canvas.querySelector('.block[data-id="'+b.id+'"]');
  function mv(ev){
    if(!moved){ pushUndo(); moved=true; }
    b.w=Math.round(clamp(ow+(ev.clientX-sx)/scale,MIN_W,canvas.clientWidth-b.x));
    el.style.width=b.w+'px'; layoutMarks(); placeToolbar();
  }
  function up(){ document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up);
    if(moved){ save(); layoutMarks(); } }
  document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up);
}

/* ================= editing ================= */
canvas.addEventListener('focusin',function(e){
  if(!e.target.classList.contains('tx')) return;
  var blk=e.target.closest('.block'), row=e.target.closest('.row');
  lastLine={bid:blk.dataset.id,lid:row.dataset.lid};
  if(selId!==blk.dataset.id) selectBlock(blk.dataset.id); else updateToolbar();
});

canvas.addEventListener('focusout',function(e){
  if(!e.target.classList.contains('tx')) return;
  var blk=e.target.closest('.block'); if(!blk) return;
  var id=blk.dataset.id;
  setTimeout(function(){
    var b=findBlock(id); if(!b) return;
    var el=canvas.querySelector('.block[data-id="'+id+'"]');
    if(el&&el.contains(document.activeElement)) return;
    for(var i=0;i<b.lines.length;i++) if(b.lines[i].text.trim()!=='') return;
    deleteBlock(id);
  },60);
});

canvas.addEventListener('beforeinput',function(e){
  if(!e.target.classList.contains('tx')) return;
  if(!typing){ pushUndo(); typing=true; }
  clearTimeout(typingT); typingT=setTimeout(function(){typing=false;},900);
});

canvas.addEventListener('input',function(e){
  if(!e.target.classList.contains('tx')) return;
  var blk=e.target.closest('.block'), row=e.target.closest('.row');
  var b=findBlock(blk.dataset.id); if(!b) return;
  var i=lineIndex(b,row.dataset.lid); if(i<0) return;
  b.lines[i].text=e.target.textContent;
  layoutMarks(row);
  save();
});

canvas.addEventListener('paste',function(e){
  if(!e.target.classList.contains('tx')) return;
  e.preventDefault();
  var t=((e.clipboardData||window.clipboardData).getData('text/plain')||'').replace(/\r/g,'');
  var parts=t.split('\n');
  var blk=e.target.closest('.block'), row=e.target.closest('.row');
  var b=findBlock(blk.dataset.id); if(!b) return;
  var idx=lineIndex(b,row.dataset.lid); if(idx<0) return;
  var l=b.lines[idx], pos=caretPos(e.target);
  var before=l.text.slice(0,pos), after=l.text.slice(pos);
  pushUndo();
  if(parts.length===1){
    l.text=before+parts[0]+after;
    save(); render(false); focusLine(b.id,l.id,(before+parts[0]).length);
  }else{
    l.text=before+parts[0];
    var add=[], lastId=l.id, lastPos=(before+parts[0]).length;
    for(var i=1;i<parts.length;i++){
      var nl={id:uid(),text:parts[i],b:false,i:false,u:false,bul:l.bul,done:false};
      if(i===parts.length-1){ nl.text=parts[i]+after; lastId=nl.id; lastPos=parts[i].length; }
      add.push(nl);
    }
    b.lines.splice.apply(b.lines,[idx+1,0].concat(add));
    save(); render(false); focusLine(b.id,lastId,lastPos);
  }
});

canvas.addEventListener('keydown',function(e){
  var tx=e.target;
  if(!tx.classList||!tx.classList.contains('tx')) return;
  var blk=tx.closest('.block'), row=tx.closest('.row');
  var b=findBlock(blk.dataset.id); if(!b) return;
  var idx=lineIndex(b,row.dataset.lid); if(idx<0) return;
  var l=b.lines[idx], pos=caretPos(tx);
  var mod=e.ctrlKey||e.metaKey;

  if(e.key==='Enter'&&mod){
    e.preventDefault(); pushUndo(); l.done=!l.done;
    if(l.done) markAnim(l.id);
    save(); render(); return;
  }
  if(e.key==='Enter'){
    e.preventDefault(); pushUndo(); typing=false;
    var before=l.text.slice(0,pos), after=l.text.slice(pos);
    l.text=before;
    var nl={id:uid(),text:after,b:false,i:false,u:false,bul:l.bul,done:false};
    b.lines.splice(idx+1,0,nl);
    save(); render(false); focusLine(b.id,nl.id,0); return;
  }
  if(e.key==='Backspace'&&pos===0&&collapsed()){
    if(idx===0){
      if(l.bul){ e.preventDefault(); pushUndo(); l.bul=false; save(); render(); return; }
      if(b.lines.length===1&&l.text===''){ e.preventDefault(); pushUndo(); deleteBlock(b.id); }
      return;
    }
    if(l.bul&&l.text!==''){ e.preventDefault(); pushUndo(); l.bul=false; save(); render(); return; }
    e.preventDefault(); pushUndo(); typing=false;
    var prev=b.lines[idx-1], at=prev.text.length;
    prev.text+=l.text; b.lines.splice(idx,1);
    save(); render(false); focusLine(b.id,prev.id,at); return;
  }
  if(e.key==='Delete'&&pos===l.text.length&&collapsed()&&idx<b.lines.length-1){
    e.preventDefault(); pushUndo(); typing=false;
    l.text+=b.lines[idx+1].text; b.lines.splice(idx+1,1);
    save(); render(false); focusLine(b.id,l.id,pos); return;
  }
  if(e.key==='ArrowUp'&&idx>0&&atEdgeRow(tx,true)){
    e.preventDefault(); focusLine(b.id,b.lines[idx-1].id,b.lines[idx-1].text.length); return;
  }
  if(e.key==='ArrowDown'&&idx<b.lines.length-1&&atEdgeRow(tx,false)){
    e.preventDefault(); focusLine(b.id,b.lines[idx+1].id,0); return;
  }
  if(mod&&e.shiftKey&&(e.key==='*'||e.key==='8')){
    e.preventDefault(); pushUndo(); l.bul=!l.bul; save(); render(); updateToolbar(); return;
  }
  if(mod&&!e.altKey&&!e.shiftKey){
    var k=e.key.toLowerCase();
    if(k==='b'||k==='i'||k==='u'){
      e.preventDefault(); pushUndo(); l[k]=!l[k];
      save(); render(); updateToolbar(); return;
    }
  }
  if(e.key==='Escape'){ tx.blur(); deselect(); }
});

/* ================= toolbar ================= */
tb.addEventListener('mousedown',function(e){ if(e.target.tagName!=='SELECT') e.preventDefault(); });
document.getElementById('tbFont').addEventListener('change',function(){
  var b=findBlock(selId); if(!b) return;
  pushUndo(); b.font=this.value; save(); render(); updateToolbar();
});
function bump(d){
  var b=findBlock(selId); if(!b) return;
  pushUndo(); b.size=clamp(b.size+d,MIN_SIZE,MAX_SIZE); save(); render(); updateToolbar();
}
document.getElementById('tbMinus').onclick=function(){ bump(-1); };
document.getElementById('tbPlus').onclick=function(){ bump(1); };
function toggleFmt(prop){
  var b=findBlock(selId); if(!b) return;
  pushUndo();
  var l=currentLine();
  if(l&&lastLine&&lastLine.bid===b.id){ l[prop]=!l[prop]; }
  else{
    var all=true;
    for(var i=0;i<b.lines.length;i++) if(!b.lines[i][prop]) all=false;
    for(var j=0;j<b.lines.length;j++) b.lines[j][prop]=!all;
  }
  save(); render(); updateToolbar();
}
document.getElementById('tbB').onclick=function(){ toggleFmt('b'); };
document.getElementById('tbI').onclick=function(){ toggleFmt('i'); };
document.getElementById('tbU').onclick=function(){ toggleFmt('u'); };
document.getElementById('tbL').onclick=function(){ toggleFmt('bul'); };

/* ================= dates & zoom ================= */
function go(iso){
  prune(); writeLocal();
  cur=iso; selId=null; lastLine=null; undoS.length=0; redoS.length=0;
  refreshUndo(); updateDateUI(); render(false);
}
function updateDateUI(){
  document.getElementById('datelabel').textContent=fmtLong(cur);
  document.getElementById('dateinput').value=cur;
  document.getElementById('dot').style.display=(cur===todayISO())?'block':'none';
}
document.getElementById('prev').onclick=function(){ go(shiftISO(cur,-1)); };
document.getElementById('next').onclick=function(){ go(shiftISO(cur,1)); };
document.getElementById('todayBtn').onclick=function(){ go(todayISO()); };
document.getElementById('dateinput').addEventListener('change',function(){ if(this.value) go(this.value); });
document.getElementById('undoBtn').onclick=undo;
document.getElementById('redoBtn').onclick=redo;
document.getElementById('zoomBtn').onclick=function(){
  zoom=(zoom==='fit')?'full':'fit';
  try{ localStorage.setItem(K_ZOOM,zoom); }catch(e){}
  fit();
  if(zoom==='full') stage.scrollTop=0;
};

/* ================= carry forward ================= */
document.getElementById('carry').onclick=function(){
  var dates=[];
  for(var d in pages) if(d<cur && pages[d].blocks && pages[d].blocks.length) dates.push(d);
  if(!dates.length){ say('No earlier page has anything on it.'); return; }
  dates.sort();
  var src=dates[dates.length-1], sb=pages[src].blocks, carried=[], count=0;
  for(var i=0;i<sb.length;i++){
    var b=sb[i], keep=[];
    for(var j=0;j<b.lines.length;j++){
      var l=b.lines[j];
      if(!l.done && l.text.trim()!==''){
        keep.push({id:uid(),text:l.text,b:l.b,i:l.i,u:l.u,bul:l.bul,done:false});
        count++;
      }
    }
    if(keep.length) carried.push({id:uid(),x:b.x,y:b.y,w:b.w,font:b.font,size:b.size,z:++zTop,lines:keep});
  }
  if(!carried.length){ say('Everything on '+fmtShort(src)+' is struck off.'); return; }
  var page=pg();
  if(page.blocks.length){
    if(!confirm('Add '+count+' unfinished item'+(count===1?'':'s')+' from '+fmtShort(src)+' to this page?\n\n'+
                'This page already has '+page.blocks.length+' block'+(page.blocks.length===1?'':'s')+' on it.')) return;
    for(var k=0;k<carried.length;k++){
      carried[k].x=clamp(carried[k].x+26,0,Math.max(0,canvas.clientWidth-carried[k].w));
      carried[k].y=clamp(carried[k].y+26,0,Math.max(0,canvas.clientHeight-24));
    }
  }
  pushUndo();
  page.blocks=page.blocks.concat(carried);
  save(); render(false);
  say('Carried '+count+' item'+(count===1?'':'s')+' forward from '+fmtShort(src)+'.');
};

/* ================= cloud sync ================= */
var pushT=null, pulling=false, lastPull=0;
function cfg(){
  return {key:localStorage.getItem(K_APIKEY)||'', bin:localStorage.getItem(K_BIN)||''};
}
function setStatus(cls,label,title){
  var d=document.getElementById('sdot');
  d.className='sdot'+(cls?' '+cls:'');
  document.getElementById('slabel').textContent=label;
  document.getElementById('syncBtn').title=title||'Cloud sync';
}
function pushSoon(){
  var c=cfg(); if(!c.key||!c.bin) return;
  clearTimeout(pushT); pushT=setTimeout(push,2200);
}
function push(){
  var c=cfg(); if(!c.key||!c.bin) return;
  if(pulling){ clearTimeout(pushT); pushT=setTimeout(push,800); return; }
  setStatus('busy','Saving');
  fetch(API+'/'+c.bin,{method:'PUT',
    headers:{'Content-Type':'application/json','X-Master-Key':c.key,'X-Bin-Versioning':'false'},
    body:JSON.stringify({v:2,pages:pages})})
  .then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    setStatus('ok','Synced','Last saved to the cloud just now');
  })
  .catch(function(err){
    setStatus('err','Sync error','Could not save: '+err.message+'. Click to check your settings.');
  });
}
function mergePages(remote){
  var changedCur=false, localNewer=false;
  for(var d in remote){
    var rp=remote[d];
    if(!rp||!Array.isArray(rp.blocks)) continue;
    var lp=pages[d];
    if(!lp || (rp.u||0) > (lp.u||0)){
      pages[d]=rp;
      if(d===cur) changedCur=true;
    } else if((lp.u||0) > (rp.u||0)) localNewer=true;
  }
  for(var e in pages){ if(!remote[e]) localNewer=true; }
  return {changedCur:changedCur, localNewer:localNewer};
}
function pull(quiet){
  var c=cfg();
  if(!c.key||!c.bin){ setStatus('','Sync off','Click to set up syncing across devices'); return; }
  if(pulling) return;
  pulling=true; setStatus('busy','Checking');
  fetch(API+'/'+c.bin+'/latest',{headers:{'X-Master-Key':c.key,'X-Bin-Meta':'false'}})
  .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(function(data){
    var rec=(data&&data.record)?data.record:data;
    var rp=(rec&&rec.pages)?rec.pages:null;
    pulling=false; lastPull=Date.now();
    if(!rp){ setStatus('ok','Synced'); pushSoon(); return; }
    var res=mergePages(rp);
    normalise(); writeLocal();
    setStatus('ok','Synced','In sync with the cloud');
    if(res.changedCur){
      undoS.length=0; redoS.length=0; refreshUndo(); render(false);
      if(!quiet) say('Updated from your other device.');
    }
    if(res.localNewer) pushSoon();
  })
  .catch(function(err){
    pulling=false;
    setStatus('err','Sync error','Could not load: '+err.message+'. Click to check your settings.');
  });
}
function maybePull(){
  if(Date.now()-lastPull>4000 && Date.now()-lastEdit>2500) pull(true);
}
window.addEventListener('focus',maybePull);
document.addEventListener('visibilitychange',function(){ if(!document.hidden) maybePull(); });

/* --- sync settings modal --- */
function openModal(){
  var c=cfg();
  document.getElementById('mkey').value=c.key;
  document.getElementById('mbin').value=c.bin;
  document.getElementById('mNote').textContent = c.key&&!c.bin
    ? 'A key is already saved on this browser from your checklist app.' : '';
  modal.classList.add('on');
  document.getElementById(c.key?'mbin':'mkey').focus();
}
function closeModal(){ modal.classList.remove('on'); }
document.getElementById('syncBtn').onclick=openModal;
document.getElementById('mCancel').onclick=closeModal;
modal.addEventListener('mousedown',function(e){ if(e.target===modal) closeModal(); });
document.getElementById('mSave').onclick=function(){
  var k=document.getElementById('mkey').value.trim();
  var bn=document.getElementById('mbin').value.trim();
  if(!k||!bn){ document.getElementById('mNote').textContent='Both a master key and a bin ID are needed.'; return; }
  try{ localStorage.setItem(K_APIKEY,k); localStorage.setItem(K_BIN,bn); }catch(e){}
  closeModal(); pull(); say('Cloud sync is on.');
};
document.getElementById('mDisc').onclick=function(){
  try{ localStorage.removeItem(K_BIN); }catch(e){}
  closeModal(); setStatus('','Sync off','Click to set up syncing across devices');
  say('Cloud sync turned off. Your pages are still saved in this browser.');
};
document.getElementById('mkbin').onclick=function(){
  var k=document.getElementById('mkey').value.trim();
  var note=document.getElementById('mNote');
  if(!k){ note.textContent='Paste your master key first.'; return; }
  note.textContent='Creating a bin...';
  fetch(API,{method:'POST',
    headers:{'Content-Type':'application/json','X-Master-Key':k,
             'X-Bin-Name':'notebook','X-Bin-Private':'true'},
    body:JSON.stringify({v:2,pages:pages})})
  .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(function(d){
    var id=d&&d.metadata&&d.metadata.id;
    if(!id) throw new Error('no bin id returned');
    document.getElementById('mbin').value=id;
    note.textContent='Bin created. Press Save, then paste this bin ID on your other device.';
  })
  .catch(function(err){ note.textContent='Could not create a bin: '+err.message; });
};

/* ================= global keys ================= */
document.addEventListener('mousedown',function(e){
  if(!selId) return;
  var t=e.target;
  if(t.closest&&(t.closest('.block')||t.closest('.toolbar')||t.closest('.bar')||t.closest('.modal'))) return;
  deselect();
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&modal.classList.contains('on')){ closeModal(); return; }
  var mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==='z'){ e.preventDefault(); if(e.shiftKey) redo(); else undo(); }
  if(mod&&e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); }
  if(e.altKey&&e.key==='ArrowLeft'){ e.preventDefault(); go(shiftISO(cur,-1)); }
  if(e.altKey&&e.key==='ArrowRight'){ e.preventDefault(); go(shiftISO(cur,1)); }
});
window.addEventListener('resize',fit);
stage.addEventListener('scroll',placeToolbar);
window.addEventListener('beforeunload',function(){ prune(); writeLocal(); });

/* ================= boot ================= */
buildFurniture();
load();
try{ zoom=localStorage.getItem(K_ZOOM)==='full'?'full':'fit'; }catch(e){}
updateDateUI(); refreshUndo(); fit(); render(false);
setStatus('','Sync off','Click to set up syncing across devices');
pull(true);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){ layoutMarks(); });

})();
</script>
