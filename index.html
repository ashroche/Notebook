<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,600;1,400&display=block" rel="stylesheet">
<style>
:root{
  --paper:#faf6ec;
  --ink:#22262e;
  --pen-red:#cf2f27;
  --desk-1:#39342c;
  --desk-2:#191714;
  --chrome:#26241f;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(1100px 780px at 50% -8%, var(--desk-1), var(--desk-2) 72%);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  color:#e6e2da;overflow:hidden;
}

/* ---------- bars ---------- */
.bar{position:fixed;left:0;right:0;z-index:100;display:flex;align-items:center;gap:7px;padding:0 13px}
.bar.top{top:0;height:48px;background:linear-gradient(#14120fe0,#14120f00)}
.bar button,.bar .datewrap,.bar .pager{
  font:inherit;font-size:13px;color:#ded9d0;background:#ffffff0d;
  border:1px solid #ffffff1a;border-radius:7px;padding:6px 11px;cursor:pointer;line-height:1}
.bar button:hover:not(:disabled){background:#ffffff1c}
.bar button:disabled{opacity:.3;cursor:default}
.bar button:focus-visible,.bar input:focus-visible{outline:2px solid #b9d0ff;outline-offset:2px}
.bar select{font:inherit;font-size:13px;color:#ded9d0;background:#ffffff0d;
  border:1px solid #ffffff1a;border-radius:7px;padding:6px 8px;cursor:pointer;color-scheme:dark}
.bar select:hover{background:#ffffff1c}
.bar option{background:#26241f;color:#ded9d0}
.nav{padding:6px 10px !important;font-size:15px !important}
.datewrap{display:flex;align-items:center;gap:8px;padding:5px 10px;position:relative;cursor:pointer}
.datewrap input{font:inherit;font-size:13px;color:#f2eee6;background:transparent;border:0;padding:0;
  color-scheme:dark;cursor:pointer}
.datelabel{font-size:13px;color:#f2eee6;white-space:nowrap}
.today-dot{width:6px;height:6px;border-radius:50%;background:var(--pen-red);flex:none}
.hidden-date{position:absolute;inset:0;opacity:0;cursor:pointer}
.pager{display:flex;align-items:center;gap:2px;padding:3px 4px;cursor:default}
.pager button{border:0;background:transparent;padding:4px 7px;font-size:13px}
.pager .pnum{font-size:12px;color:#bdb7ad;min-width:34px;text-align:center;user-select:none}
.spacer{flex:1}
.sep{width:1px;height:20px;background:#ffffff1a;margin:0 3px;flex:none}

#syncBtn{display:flex;align-items:center;gap:7px}
.sdot{width:7px;height:7px;border-radius:50%;background:#7b756a;flex:none}
.sdot.ok{background:#57a866}
.sdot.busy{background:#d8a13c;animation:pulse 1s ease-in-out infinite}
.sdot.err{background:#cf4a3f}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ---------- fixed formatting bar ---------- */
.dock{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:150;
  display:flex;align-items:center;gap:3px;background:var(--chrome);
  border:1px solid #ffffff20;border-radius:11px;padding:6px 8px;
  box-shadow:0 12px 34px rgba(0,0,0,.55)}
.dock select,.dock button{font:inherit;font-size:12.5px;color:#e4dfd6;background:transparent;
  border:0;border-radius:6px;padding:6px 9px;cursor:pointer;line-height:1}
.dock select{color-scheme:dark;padding:5px 4px}
.dock option{background:#26241f;color:#e4dfd6}
.dock button:hover:not(:disabled),.dock select:hover:not(:disabled){background:#ffffff18}
.dock button.act{background:#ffffff28;color:#fff}
.dock [disabled]{opacity:.3;cursor:default}
.dock .size{font-size:12px;min-width:20px;text-align:center;color:#bdb7ad;user-select:none}
.dock .sep{width:1px;height:18px;background:#ffffff1f;margin:0 4px}
.dock button:focus-visible,.dock select:focus-visible{outline:2px solid #b9d0ff;outline-offset:1px}
.swatches{display:flex;align-items:center;gap:5px;padding:0 3px}
.sw{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.28);cursor:pointer;padding:0;
  box-shadow:0 0 0 0 #fff0;transition:box-shadow .12s}
.sw:hover{box-shadow:0 0 0 2px #ffffff45}
.sw.on{box-shadow:0 0 0 2px #fff}
.dock .danger:hover:not(:disabled){background:#6d2b26;color:#ffeceb}

/* ---------- stage & notebook ---------- */
.stage{position:absolute;inset:48px 0 62px 0;overflow:auto;display:flex;
  justify-content:center;align-items:flex-start;padding:12px 0 0}
.notebook{position:relative;width:818px;height:1123px;flex:none;transform-origin:top center}

.cover{position:absolute;left:18px;top:-7px;width:812px;height:1139px;border-radius:3px 7px 7px 3px;
  background:linear-gradient(160deg,#413a30,#26211b);
  box-shadow:0 30px 60px rgba(0,0,0,.55), 0 6px 14px rgba(0,0,0,.4)}
/* cover materials */
.cover.cover-kraft{background:linear-gradient(160deg,#4a4132,#2a231a)}
.cover.cover-black{background:linear-gradient(150deg,#2a2c2f,#111214);
  box-shadow:0 30px 60px rgba(0,0,0,.6), 0 6px 14px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.05)}
.cover.cover-black::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.018) 1px, transparent 1.1px);
  background-size:3px 3px}
.cover.cover-navy{background:linear-gradient(150deg,#26344a,#141b28)}
.cover.cover-red{background:linear-gradient(150deg,#5a2b28,#331715)}
.cover.cover-forest{background:linear-gradient(150deg,#2c4232,#16241a)}
.cover.cover-grey{background:linear-gradient(150deg,#54565b,#303236)}
.sheet{position:absolute;width:794px;height:1123px;border-radius:1px 3px 3px 1px}
.s1{left:35px;top:12px;background:#c8c2b3}
.s2{left:32px;top:8px;background:#ded9cc}
.s3{left:29px;top:4px;background:#efebe0}

.page{position:absolute;left:26px;top:0;width:794px;height:1123px;background:var(--paper);
  border-radius:1px 3px 3px 1px;box-shadow:0 2px 5px rgba(0,0,0,.35);overflow:hidden}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.06;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>")}
.gutter{position:absolute;left:0;top:0;bottom:0;width:96px;pointer-events:none;
  background:linear-gradient(90deg, rgba(74,56,30,.17), rgba(74,56,30,.04) 46%, transparent)}
.topfade{position:absolute;left:0;right:0;top:0;height:26px;pointer-events:none;
  background:linear-gradient(rgba(74,56,30,.10),transparent)}

.holes{position:absolute;left:0;top:0;bottom:0;width:100px;pointer-events:none;z-index:3}
.hole{position:absolute;left:34px;width:14px;height:14px;border-radius:50%;
  background:radial-gradient(circle at 50% 30%, #35302a, #17140f 70%);
  box-shadow:inset 0 2px 3px rgba(0,0,0,.85), 0 1px 0 rgba(255,255,255,.6)}
.spiral{position:absolute;left:0;top:0;width:818px;height:1123px;pointer-events:none;z-index:7}
.wire{fill:none;stroke:url(#wiregrad);stroke-width:5.4;stroke-linecap:round}
.wireshade{fill:none;stroke:rgba(0,0,0,.17);stroke-width:7.4;stroke-linecap:round}

/* ---------- page turn ---------- */
/* A single opaque leaf lifts off the spine and swings away, revealing the
   destination page painted on the base #page underneath. No double-sided 3D,
   so an image can never appear mirrored on a back face. */
.flipzone{position:absolute;left:26px;top:0;width:794px;height:1123px;
  perspective:2400px;perspective-origin:0% 50%;pointer-events:none;z-index:6;display:none}
.flipzone.on{display:block}
.spineshadow{position:absolute;left:0;top:0;width:150px;height:100%;opacity:0;
  background:linear-gradient(90deg, rgba(0,0,0,.34), rgba(0,0,0,0));border-radius:2px;z-index:1}
.leaf{position:absolute;inset:0;transform-origin:left center;will-change:transform;z-index:2}
.lf{position:absolute;inset:0;overflow:hidden;background:var(--paper);
  border-radius:1px 3px 3px 1px;box-shadow:2px 6px 22px rgba(0,0,0,.30)}
.lfclone{position:absolute;inset:0;overflow:hidden}
/* shading that deepens as the leaf tilts, giving it dimension */
.lf .sheen{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:linear-gradient(100deg, rgba(0,0,0,.28) 0%, rgba(0,0,0,.10) 30%,
    rgba(0,0,0,0) 55%)}

/* ---------- writing area ---------- */
.canvas{position:absolute;left:80px;top:30px;right:26px;bottom:28px;z-index:4}
.hint{position:absolute;left:6px;top:8px;font-family:'Caveat',cursive;font-size:27px;
  color:rgba(0,0,0,.17);pointer-events:none;user-select:none;line-height:1.35}

.block{position:absolute;color:var(--ink)}
.block img{display:block;width:100%;height:100%;border-radius:2px;
  box-shadow:0 1px 4px rgba(0,0,0,.22)}
.row{display:flex;align-items:flex-start;position:relative}

.tick{position:absolute;display:flex;align-items:center;justify-content:center;cursor:pointer}
.tick svg{width:100%;height:100%;overflow:visible;display:block}
.tick path{fill:none;stroke:var(--pen-red);stroke-linecap:round;stroke-linejoin:round;
  stroke-dashoffset:0}
/* Every unstruck line shows a faint tick at rest so you can see it's clickable;
   it darkens on hover, and a struck line shows the full red mark. */
.row:not(.done) .tick{opacity:.16;transition:opacity .12s}
.row:not(.done) .tick:hover{opacity:.55}
.row.done .tick{opacity:1}
.block:focus-within .row:not(.done) .tick{opacity:.16}
.block:focus-within .row:not(.done) .tick:hover{opacity:.55}

.bul{position:absolute;pointer-events:none}
.bul svg{display:block;overflow:visible}
.bul path{fill:var(--ink);opacity:.85}

.tx{flex:1;min-height:1.3em;outline:none;white-space:pre-wrap;overflow-wrap:break-word;
  line-height:1.3;padding-right:2px}
.tx b{font-weight:700}
.tx i{font-style:italic}
.tx u{text-decoration:underline}

.strike{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.strike path{fill:none;stroke:var(--pen-red);stroke-linecap:round;opacity:.93}

/* frame, move bands and resize handles */
.frame{position:absolute;inset:-9px;border:1px dashed rgba(0,0,0,.26);border-radius:3px;
  pointer-events:none;display:none}
.block:hover .frame,.block.sel .frame{display:block}
.block.sel .frame{border-color:rgba(0,0,0,.42)}
.block.blocksel .frame{border-color:rgba(45,95,200,.7);background:rgba(70,120,220,.10)}
.mv{position:absolute;display:none;cursor:move}
.block:hover .mv,.block.sel .mv{display:block}
.mv-t{left:-9px;right:-9px;top:-15px;height:14px}
.mv-b{left:-9px;right:-9px;bottom:-15px;height:14px}
.mv-l{top:-9px;bottom:-9px;left:-15px;width:14px}
.mv-r{top:-9px;bottom:-9px;right:-15px;width:14px}
.hd{position:absolute;width:9px;height:9px;background:#fff;border:1px solid rgba(0,0,0,.45);
  border-radius:2px;display:none;z-index:2}
.block:hover .hd,.block.sel .hd{display:block}
.hd-nw{left:-13px;top:-13px;cursor:nwse-resize}
.hd-n {left:calc(50% - 4px);top:-13px;cursor:ns-resize}
.hd-ne{right:-13px;top:-13px;cursor:nesw-resize}
.hd-e {right:-13px;top:calc(50% - 4px);cursor:ew-resize}
.hd-se{right:-13px;bottom:-13px;cursor:nwse-resize}
.hd-s {left:calc(50% - 4px);bottom:-13px;cursor:ns-resize}
.hd-sw{left:-13px;bottom:-13px;cursor:nesw-resize}
.hd-w {left:-13px;top:calc(50% - 4px);cursor:ew-resize}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:400;display:none;align-items:center;justify-content:center;
  background:rgba(10,9,7,.66)}
.modal.on{display:flex}
.card{width:430px;max-width:92vw;background:#211f1b;border:1px solid #ffffff1c;
  border-radius:13px;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.card h2{margin:0 0 6px;font-size:16px;font-weight:600;color:#f0ece3}
.card p{margin:0 0 16px;font-size:12.5px;line-height:1.55;color:#a8a297}
.card label{display:block;font-size:11.5px;color:#a8a297;margin:12px 0 5px}
.card input{width:100%;font:inherit;font-size:13px;color:#f0ece3;background:#15130f;
  border:1px solid #ffffff1c;border-radius:7px;padding:9px 10px}
.card input:focus{outline:2px solid #b9d0ff;outline-offset:1px}
.card .acts{display:flex;gap:8px;margin-top:20px;align-items:center}
.card button{font:inherit;font-size:12.5px;color:#ded9d0;background:#ffffff0d;
  border:1px solid #ffffff1a;border-radius:7px;padding:8px 13px;cursor:pointer}
.card button:hover{background:#ffffff1c}
.card button.primary{background:#3d6b46;border-color:#4c8257;color:#eaf5ec}
.card button.quiet{background:transparent;border-color:transparent;color:#8e887d}
.card .note{font-size:11.5px;color:#8e887d;margin-top:12px;line-height:1.5}

.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--chrome);
  border:1px solid #ffffff20;color:#e6e1d8;padding:9px 16px;border-radius:22px;font-size:13px;
  z-index:300;opacity:0;pointer-events:none;transition:opacity .18s;max-width:70vw;text-align:center}
.toast.on{opacity:1}

@media (prefers-reduced-motion: reduce){
  .strike path,.tick path{transition:none !important;stroke-dashoffset:0 !important}
  .leaf{transition:none !important}
  .toast{transition:none}
  .sdot.busy{animation:none}
}
</style>
</head>
<body>

<div class="bar top">
  <button class="nav" id="prevDay" title="Previous day (Alt+Left)">&lsaquo;</button>
  <span class="datewrap">
    <span class="today-dot" id="dot" style="display:none"></span>
    <span class="datelabel" id="datelabel">&nbsp;</span>
    <input type="date" id="dateinput" class="hidden-date" aria-label="Go to date">
  </span>
  <button class="nav" id="nextDay" title="Next day (Alt+Right)">&rsaquo;</button>
  <button id="todayBtn">Today</button>
  <span class="sep"></span>
  <span class="pager">
    <button id="prevPage" title="Previous page (Page Up)">&lsaquo;</button>
    <span class="pnum" id="pnum">1 / 1</span>
    <button id="nextPage" title="Next page (Page Down)">&rsaquo;</button>
    <button id="addPage" title="Add a page to this day">+</button>
  </span>
  <span class="sep"></span>
  <button id="carry" title="Bring unfinished items forward from your last written day">Carry forward</button>
  <span class="spacer"></span>
  <select id="coverSel" title="Notebook cover" aria-label="Notebook cover">
    <option value="cardboard">Cardboard cover</option>
    <option value="kraft">Kraft cover</option>
    <option value="black">Black cover</option>
    <option value="navy">Navy cover</option>
    <option value="red">Red cover</option>
    <option value="forest">Forest cover</option>
    <option value="grey">Grey cover</option>
  </select>
  <button id="zoomBtn" title="Fit to window, or true A4 size">Fit</button>
  <button id="syncBtn" title="Cloud sync"><span class="sdot" id="sdot"></span><span id="slabel">Sync off</span></button>
  <span class="sep"></span>
  <button id="undoBtn" title="Undo (Ctrl+Z)">Undo</button>
  <button id="redoBtn" title="Redo (Ctrl+Shift+Z)">Redo</button>
</div>

<div class="stage" id="stage">
  <div class="notebook" id="notebook">
    <div class="cover" id="cover"></div>
    <div class="sheet s1"></div><div class="sheet s2"></div><div class="sheet s3"></div>
    <div class="page" id="page">
      <div class="gutter"></div>
      <div class="topfade"></div>
      <div class="grain"></div>
      <div class="holes" id="holes"></div>
      <div class="canvas" id="canvas"><div class="hint" id="hint">double-click anywhere to write</div></div>
    </div>
    <div class="flipzone" id="flipzone">
      <div class="spineshadow" id="spineShadow"></div>
      <div class="leaf" id="leaf">
        <div class="lf" id="lfFront"><div class="lfclone" id="lfFrontClone"></div><div class="sheen"></div></div>
      </div>
    </div>
    <svg class="spiral" id="spiral" viewBox="0 0 818 1123" aria-hidden="true"></svg>
  </div>
</div>

<div class="dock" id="dock">
  <select id="tbFont" aria-label="Font">
    <option value="hand">Handwriting</option>
    <option value="sans">Sans</option>
    <option value="serif">Serif</option>
  </select>
  <span class="sep"></span>
  <button id="tbMinus" aria-label="Smaller">&minus;</button>
  <span class="size" id="tbSize">17</span>
  <button id="tbPlus" aria-label="Bigger">+</button>
  <span class="sep"></span>
  <button id="tbB" title="Bold (Ctrl+B)"><b>B</b></button>
  <button id="tbI" title="Italic (Ctrl+I)"><i>I</i></button>
  <button id="tbU" title="Underline (Ctrl+U)"><u>U</u></button>
  <button id="tbL" title="Bullet (Ctrl+Shift+8)">&bull;</button>
  <span class="sep"></span>
  <span class="swatches" id="swatches"></span>
  <span class="sep"></span>
  <button id="tbDel" class="danger" title="Delete the selected box (Delete)">Delete box</button>
</div>

<div class="modal" id="modal">
  <div class="card">
    <h2>Cloud sync</h2>
    <p>Saves your pages to a JSONBin bin so you can open this notebook on another device. Your key is kept in this browser only and is never sent anywhere except JSONBin.</p>
    <label for="mkey">JSONBin master key</label>
    <input type="password" id="mkey" autocomplete="off" spellcheck="false" placeholder="$2a$10$...">
    <label for="mbin">Bin ID</label>
    <input type="text" id="mbin" autocomplete="off" spellcheck="false" placeholder="Paste one, or create a new bin below">
    <div class="acts">
      <button id="mkbin">Create a new bin</button>
      <span class="spacer"></span>
      <button class="quiet" id="mDisc">Disconnect</button>
      <button id="mCancel">Cancel</button>
      <button class="primary" id="mSave">Save</button>
    </div>
    <div class="note" id="mNote"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

/* ================= constants ================= */
var NB_W=818, NB_H=1123;
var FONTS={hand:"'Caveat','Bradley Hand',cursive",sans:"'Inter',system-ui,sans-serif",serif:"'Lora',Georgia,serif"};
/* Caveat has a small x-height, so it needs ~1.55x the px size of Inter to look the same
   size on the page. Sizes in the dock are apparent size, not raw CSS px. */
var FSCALE={hand:1.55,sans:1,serif:1};
var DEF_SIZE=17, MIN_SIZE=11, MAX_SIZE=40;
var MIN_W=90, MIN_H=26, DEF_W=300;
var KEY='notebook-v1-pages';
var K_APIKEY='checklist-apikey';   /* shared with the checklist apps on this origin */
var K_BIN='notebook-binid', K_ZOOM='notebook-zoom', K_PAPER='notebook-paper', K_COVER='notebook-cover';
var API='https://api.jsonbin.io/v3/b';
var IMG_MAX=900, IMG_Q=0.72;
var SIZE_WARN=700*1024, SIZE_STOP=980*1024;   /* JSONBin caps a standard bin at 1MB */

var PAPERS=[
  {id:'cream', c:'#faf6ec', label:'Cream'},
  {id:'white', c:'#fdfdfc', label:'White'},
  {id:'blue',  c:'#eaf1fa', label:'Light blue'},
  {id:'yellow',c:'#fbf5dd', label:'Light yellow'},
  {id:'green', c:'#ebf4ec', label:'Light green'},
  {id:'pink',  c:'#fbeef1', label:'Light pink'},
  {id:'grey',  c:'#f1f1ef', label:'Light grey'}
];

var canvas=document.getElementById('canvas');
var hint=document.getElementById('hint');
var nb=document.getElementById('notebook');
var stage=document.getElementById('stage');
var dock=document.getElementById('dock');
var toast=document.getElementById('toast');
var modal=document.getElementById('modal');

var pages={}, cur=todayISO(), si=0;
var selId=null, zTop=1, scale=1, zoom='fit';
var undoS=[], redoS=[], typing=false, typingT=null;
var lastLine=null, animSet={}, animT=null, lastEdit=0, turning=false;
var dropPoint={x:40,y:40};

/* ================= helpers ================= */
function uid(){ return Math.random().toString(36).slice(2,9); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function hash(s){ var h=2166136261; for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=(h*16777619)>>>0; } return h>>>0; }
function pad(n){ return String(n).padStart(2,'0'); }
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function shiftISO(iso,n){ var p=iso.split('-'); var d=new Date(+p[0],+p[1]-1,+p[2]); d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fmtLong(iso){ var p=iso.split('-'); return new Date(+p[0],+p[1]-1,+p[2])
  .toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'}); }
function fmtShort(iso){ var p=iso.split('-'); return new Date(+p[0],+p[1]-1,+p[2])
  .toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'}); }
function say(m){ toast.textContent=m; toast.classList.add('on');
  clearTimeout(say._t); say._t=setTimeout(function(){toast.classList.remove('on');},3200); }
function reduced(){ return window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches; }

function day(d){ d=d||cur; if(!pages[d]) pages[d]={sheets:[{id:uid(),blocks:[]}]};
  if(!pages[d].sheets||!pages[d].sheets.length) pages[d].sheets=[{id:uid(),blocks:[]}];
  return pages[d]; }
function sheets(d){ return day(d).sheets; }

var ALLOW={B:1,I:1,U:1};
function scrub(node){
  var kids=[].slice.call(node.childNodes);

    var n=kids[i];
    if(n.nodeType===3) continue;
    if(n.nodeType!==1){ node.removeChild(n); continue; }
    var tag=n.tagName;
    if(tag==='BR'){ node.replaceChild(document.createTextNode(' '),n); continue; }
    scrub(n);
    var keep=tag;

}

function lineText(h){ var d=document.createElement('div'); d.innerHTML=h||''; return d.textContent||''; }
function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ================= storage ================= */
function docSize(){ try{ return JSON.stringify({v:3,pages:pages}).length; }catch(e){ return 0; } }
function writeLocal(){
  try{ localStorage.setItem(KEY,JSON.stringify({v:3,pages:pages})); }
  catch(e){ say('Could not save locally. Browser storage is full, most likely from pasted images.'); }
}
function load(){
  var raw=null;
  try{ raw=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!raw||typeof raw!=='object'){ pages={}; return; }
  if(raw.v===3&&raw.pages){ pages=raw.pages; normalise(); return; }

  var src = (raw.v===2&&raw.pages)?raw.pages:(raw.pages||raw);
  pages={};
  for(var d in src){
    var p=src[d];
    if(!p||!Array.isArray(p.blocks)) continue;
    for(var i=0;i<p.blocks.length;i++){
      var b=p.blocks[i];
      if(raw.v!==2 && b.font==='hand' && b.size>=20) b.size=Math.round(b.size/FSCALE.hand);
      b.size=clamp(b.size||DEF_SIZE,MIN_SIZE,MAX_SIZE);
      b.kind='text';
      for(var j=0;j<(b.lines||[]).length;j++){
        var l=b.lines[j];
        var h=esc(l.text||'');
        if(l.u) h='<u>'+h+'</u>';
        if(l.i) h='<i>'+h+'</i>';
        if(l.b) h='<b>'+h+'</b>';
        l.html=h; delete l.text; delete l.b; delete l.i; delete l.u;
      }
    }
    pages[d]={u:p.u||Date.now(),sheets:[{id:uid(),blocks:p.blocks}]};
  }
  normalise(); writeLocal();
}
function normalise(){
  for(var d in pages){
    var p=pages[d];
    if(!p||!Array.isArray(p.sheets)){ delete pages[d]; continue; }
    for(var s=0;s<p.sheets.length;s++){
      var bl=p.sheets[s].blocks;
      if(!Array.isArray(bl)){ p.sheets[s].blocks=[]; continue; }
      for(var i=0;i<bl.length;i++){
        var b=bl[i];
        if(!b.kind) b.kind='text';
        if(b.kind==='image'){ if(!b.src){ bl.splice(i--,1);} continue; }
        if(!Array.isArray(b.lines)||!b.lines.length){ bl.splice(i--,1); continue; }
        for(var j=0;j<b.lines.length;j++){
          var l=b.lines[j];
          if(l.html===undefined) l.html=esc(l.text||''), delete l.text;
          if(l.bul===undefined) l.bul=false;
        }
      }
    }
  }
}
function prune(){
  for(var d in pages){
    var p=pages[d];
    while(p.sheets.length>1 && !p.sheets[p.sheets.length-1].blocks.length &&
          !(d===cur && si===p.sheets.length-1)) p.sheets.pop();
    var empty=true;
    for(var s=0;s<p.sheets.length;s++) if(p.sheets[s].blocks.length) empty=false;
    if(empty && !p.u) delete pages[d];
  }
}
function save(){
  day().u=Date.now(); lastEdit=Date.now();
  prune(); writeLocal(); pushSoon();
}

/* ================= undo ================= */
function snap(){ return JSON.stringify(blocks()); }
function pushUndo(){ undoS.push(snap()); if(undoS.length>80) undoS.shift(); redoS.length=0; refreshUndo(); }
function undo(){ if(!undoS.length) return; redoS.push(snap());
  sheet().blocks=JSON.parse(undoS.pop()); if(!findBlock(selId)) selId=null;
  save(); render(false); refreshUndo(); }
function redo(){ if(!redoS.length) return; undoS.push(snap());
  sheet().blocks=JSON.parse(redoS.pop()); if(!findBlock(selId)) selId=null;
  save(); render(false); refreshUndo(); }
function refreshUndo(){
  document.getElementById('undoBtn').disabled=!undoS.length;
  document.getElementById('redoBtn').disabled=!redoS.length;
}

/* ================= pen marks ================= */
function tickSVG(seed){
  var r=hash(seed);
  function n(i,a){ return ((((r>>(i*4))&15)/15)-0.5)*2*a; }
  var rot=n(0,5.5), sc=0.92+((r>>3)%20)/100;
  var cx=(7.8+n(7,0.5)), cy=(18.7+n(1,0.9));
  var down='M '+(3.2+n(1,0.8)).toFixed(1)+' '+(12.0+n(2,1.0)).toFixed(1)+
           ' C '+(4.9+n(3,0.6)).toFixed(1)+' '+(13.7+n(4,0.7)).toFixed(1)+
           ' '+(6.2+n(5,0.6)).toFixed(1)+' '+(15.6+n(6,0.7)).toFixed(1)+
           ' '+cx.toFixed(1)+' '+cy.toFixed(1);
  var up='M '+cx.toFixed(1)+' '+cy.toFixed(1)+
         ' C '+(11.2+n(2,0.9)).toFixed(1)+' '+(12.1+n(3,1.0)).toFixed(1)+
         ' '+(15.5+n(4,1.0)).toFixed(1)+' '+(6.2+n(5,1.1)).toFixed(1)+
         ' '+(21.2+n(6,0.9)).toFixed(1)+' '+(1.8+n(7,1.0)).toFixed(1);
  var w=(2.9+n(0,0.5)).toFixed(2);
  return '<svg viewBox="0 0 24 24" preserveAspectRatio="xMidYMid meet" '+
    'style="transform:rotate('+rot.toFixed(1)+'deg) scale('+sc.toFixed(2)+')">'+
    '<path d="'+down+'" style="stroke-width:'+w+'"/>'+
    '<path d="'+up+'" style="stroke-width:'+w+'"/></svg>';
}
function bulletSVG(seed,size){
  var r=hash(seed+'b');
  function n(i,a){ return ((((r>>(i*4))&15)/15)-0.5)*2*a; }
  var rad=size*0.115, rx=rad*(1+n(0,0.22)), ry=rad*(1+n(1,0.22)), rot=n(2,40);
  var d='M '+(-rx).toFixed(2)+' 0 C '+(-rx).toFixed(2)+' '+(-ry*1.35).toFixed(2)+
        ' '+(rx).toFixed(2)+' '+(-ry*1.35).toFixed(2)+' '+(rx).toFixed(2)+' 0'+
        ' C '+(rx).toFixed(2)+' '+(ry*1.35).toFixed(2)+
        ' '+(-rx).toFixed(2)+' '+(ry*1.35).toFixed(2)+' '+(-rx).toFixed(2)+' 0 Z';
  var s=(rad*3).toFixed(1);
  return '<svg width="'+s+'" height="'+s+'" viewBox="'+(-rad*1.5)+' '+(-rad*1.5)+' '+(rad*3)+' '+(rad*3)+'"'+
    ' style="transform:rotate('+rot.toFixed(0)+'deg)"><path d="'+d+'"/></svg>';

function strikePaths(x1,x2,y,seed,fs,ln){
  var r=hash(seed);
  function n(i,a){ return ((((r>>(i*4))&15)/15)-0.5)*2*a; }
  var w=clamp(fs*0.125,1.7,3.4)+n(7,0.35);
  var o1=3+((r>>2)&7)*0.6, o2=3+((r>>5)&7)*0.7;
  var sx=x1-o1, ex=x2+o2, span=ex-sx;
  var d='M '+sx.toFixed(1)+' '+(y+n(0,1.5)).toFixed(1)+
        ' C '+(sx+span*0.32).toFixed(1)+' '+(y+n(2,2.1)-0.7).toFixed(1)+
        ' '+(sx+span*0.68).toFixed(1)+' '+(y+n(3,2.1)+0.7).toFixed(1)+
        ' '+ex.toFixed(1)+' '+(y+n(1,1.5)).toFixed(1);
  var out='<path data-ln="'+ln+'" d="'+d+'" style="stroke-width:'+w.toFixed(2)+'"/>';
  if((((r>>11)&3)===0)&&span>26){
    var s2=sx+span*0.14, e2=sx+span*0.82;
    out+='<path data-ln="'+ln+'" d="M '+s2.toFixed(1)+' '+(y+n(4,1.7)).toFixed(1)+
         ' Q '+((s2+e2)/2).toFixed(1)+' '+(y+n(5,2.3)).toFixed(1)+
         ' '+e2.toFixed(1)+' '+(y+n(6,1.7)).toFixed(1)+

var _mctx=null,_mcache={};
function spaceWidth(el){
  var cs=getComputedStyle(el);
  var f=cs.fontStyle+' '+cs.fontWeight+' '+cs.fontSize+' '+cs.fontFamily;
  if(_mcache[f]!==undefined) return _mcache[f];
  if(!_mctx) _mctx=document.createElement('canvas').getContext('2d');
  _mctx.font=f;
  var w=_mctx.measureText(' ').width;
  if(!w||!isFinite(w)) w=(parseFloat(cs.fontSize)||17)*0.28;
  _mcache[f]=w; return w;
}
/* getClientRects returns a box per inline run, so several per visual line once
   bold or italic is used. Merge anything sharing a baseline. */
function lineRects(tx,base){
  if(!tx.textContent) return [];
  var rng=document.createRange(); rng.selectNodeContents(tx);
  var rects=rng.getClientRects(), groups=[];
  for(var i=0;i<rects.length;i++){
    var r=rects[i];
    if(r.width<0.5||r.height<0.5) continue;
    var hit=null;
    for(var g=0;g<groups.length;g++)
      if(Math.abs(groups[g].top-r.top)<=Math.max(2,r.height*0.4)){ hit=groups[g]; break; }
    if(hit){
      hit.left=Math.min(hit.left,r.left); hit.right=Math.max(hit.right,r.right);
      hit.top=Math.min(hit.top,r.top); hit.height=Math.max(hit.height,r.height);
    } else groups.push({left:r.left,right:r.right,top:r.top,height:r.height});
  }
  groups.sort(function(a,b){ return a.top-b.top; });
  var out=[];
  for(var k=0;k<groups.length;k++)
    out.push({x1:(groups[k].left-base.left)/scale,x2:(groups[k].right-base.left)/scale,
              y:(groups[k].top-base.top)/scale,h:groups[k].height/scale});
  return out;
}
/* Marks are painted by default: strokeDashoffset resolves to 0 with no JS timing.
   Animation is a CSS class that wipes from hidden to shown, so if a frame is ever
   dropped the mark still ends up fully drawn rather than stuck invisible. */
function paintNow(paths){
  for(var i=0;i<paths.length;i++){
    /* clear any leftover animation transition first, or setting offset to 0 would
       animate from a residual value and a relayout could catch it mid-flight,
       leaving the stroke drawn short. 'none' dash guarantees the full stroke. */
    paths[i].style.transition='none';
    paths[i].style.strokeDasharray='none';
    paths[i].style.strokeDashoffset='0';
  }
}
function paintAnim(paths,delays,dur){
  for(var i=0;i<paths.length;i++){
    var L=paths[i].getTotalLength();
    paths[i].style.strokeDasharray=L;
    paths[i].style.strokeDashoffset=L;
    /* force layout so the offset:L start is committed before the transition */
    void paths[i].getBoundingClientRect();
    paths[i].style.transition='stroke-dashoffset '+dur[Math.min(i,dur.length-1)]+'s '+
      EASE_WIPE+' '+delays[Math.min(i,delays.length-1)]+'s';
    paths[i].style.strokeDashoffset='0';

var EASE_WIPE='cubic-bezier(.3,.6,.35,1)';
var EASE_DOWN='cubic-bezier(.42,.08,.5,1)';
var EASE_UP='cubic-bezier(.25,.55,.4,1)';

function layoutMarks(only,settleOnly){
  var rows=only?[only]:canvas.querySelectorAll('.row');
  var rm=reduced();
  for(var i=0;i<rows.length;i++){
    var row=rows[i];
    /* settleOnly is the deferred re-measure pass: skip rows that are mid-animation
       so we never snap an in-flight tick, only correct settled ones */
    if(settleOnly && row.classList.contains('anim')) continue;
    var old=row.querySelector('.strike'); if(old) old.parentNode.removeChild(old);
    var tick=row.querySelector('.tick');
    var tx=row.querySelector('.tx');
    var done=row.classList.contains('done');
    var anim=row.classList.contains('anim')&&!rm;
    var base=row.getBoundingClientRect();
    var rs=lineRects(tx,base);
    var fs=parseFloat(getComputedStyle(tx).fontSize)||17;

    if(tick){
      if(!rs.length){ tick.style.display='none'; }
      else{
        var last=rs[rs.length-1];
        var box=fs*1.05, ink=box*0.128;
        tick.style.display='flex';
        tick.style.width=box+'px'; tick.style.height=box+'px';
        tick.style.left=(last.x2+spaceWidth(tx)+fs*0.20-ink)+'px';
        tick.style.top=(last.y+last.h/2-box/2+fs*0.05)+'px';
      }
    }

    var strikeDur=0;
    if(done&&rs.length){
      var paths='';
      for(var k=0;k<rs.length;k++)
        paths+=strikePaths(rs[k].x1,rs[k].x2,rs[k].y+rs[k].h*0.545,row.dataset.lid+'#'+k,fs,k);
      var svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
      svg.setAttribute('class','strike'); svg.innerHTML=paths;
      row.insertBefore(svg,row.firstChild);
      var sp=svg.querySelectorAll('path');
      strikeDur=0.30+0.085*(rs.length-1);
      if(anim){
        var sd=[],sdur=[];
        for(var q=0;q<sp.length;q++){ sd.push((+sp[q].getAttribute('data-ln')||0)*0.085); sdur.push(0.30); }
        paintAnim(sp,sd,sdur);
      } else paintNow(sp);
    }

    if(tick&&rs.length){
      var tp=tick.querySelectorAll('path');
      if(done&&anim) paintAnim(tp,[strikeDur+0.07,strikeDur+0.16],[0.10,0.19]);
      else paintNow(tp);
    }
  }
}
function markAnim(lid){
  animSet[lid]=1; clearTimeout(animT);
  animT=setTimeout(function(){
    animSet={};
    var a=canvas.querySelectorAll('.row.anim');

/* ================= caret ================= */
function caretPos(el){

function collapsed(){ var s=window.getSelection(); return !s||s.isCollapsed; }

    else { node=document.createTextNode(''); el.appendChild(node); off=0; }
  }
  var r=document.createRange(); r.setStart(node,off); r.collapse(true);
  var s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
}
function focusLine(bid,lid,pos){
  var el=canvas.querySelector('.block[data-id="'+bid+'"] .row[data-lid="'+lid+'"] .tx');
  if(!el) return;
  el.focus(); setCaret(el,pos);
}
function atEdgeRow(el,top){
  var s=window.getSelection();
  if(!s||!s.rangeCount) return true;
  var rects=s.getRangeAt(0).getClientRects();
  var cr=rects.length?rects[0]:el.getBoundingClientRect();
  var er=el.getBoundingClientRect();
  var lh=parseFloat(getComputedStyle(el).lineHeight)||20;
  return top?(cr.top-er.top)<lh*0.6:(er.bottom-cr.bottom)<lh*0.6;
}

/* ================= block ops ================= */
function addBlock(x,y){
  pushUndo();
  var b={id:uid(),kind:'text',x:Math.round(clamp(x-6,0,Math.max(0,canvas.clientWidth-DEF_W))),
         y:Math.round(clamp(y-8,0,canvas.clientHeight-40)),w:DEF_W,z:++zTop,
         font:'hand',size:DEF_SIZE,
         lines:[{id:uid(),html:'',bul:false,done:false}]};
  blocks().push(b); selId=b.id;
  save(); render(false); focusLine(b.id,b.lines[0].id,0);
  /* the create step already captured the pre-block state; typing into it should
     not open a second undo group, so one undo removes the whole new box */
  typing=true; clearTimeout(typingT); typingT=setTimeout(function(){typing=false;},1200);
}
function deleteBlock(id){
  var bl=blocks();
  for(var i=0;i<bl.length;i++) if(bl[i].id===id){ bl.splice(i,1); break; }
  if(selId===id) selId=null;
  save(); render(false);
}
function selectBlock(id){
  if(selId===id){ updateDock(); return; }
  var prev=canvas.querySelector('.block.sel'); if(prev) prev.classList.remove('sel');
  selId=id;
  var b=findBlock(id), el=canvas.querySelector('.block[data-id="'+id+'"]');
  if(b&&el){ b.z=++zTop; el.style.zIndex=b.z; el.classList.add('sel'); save(); }
  updateDock();
}
function deselect(){
  clearBlockSel();
  var prev=canvas.querySelector('.block.sel'); if(prev) prev.classList.remove('sel');
  selId=null; lastLine=null; updateDock();
}
function currentLine(){
  if(!lastLine) return null;
  var b=findBlock(lastLine.bid); if(!b||b.kind!=='text') return null;
  var i=lineIndex(b,lastLine.lid);
  return i<0?null:b.lines[i];
}
function focusedTx(){
  var a=document.activeElement;
  return (a&&a.classList&&a.classList.contains('tx'))?a:null;
}

/* Ctrl+A selects the whole block so B/I/U/bullet apply to every line at once.
   Because each line is its own contenteditable, a native selection can't span
   them; blockSel is our own "the entire box is selected" state. */
var blockSel=null;
function selectWholeBlock(id){
  var b=findBlock(id); if(!b||b.kind!=='text') return;
  blockSel=id; selId=id;
  var tx=focusedTx(); if(tx) tx.blur();
  var s=window.getSelection(); if(s) s.removeAllRanges();
  var el=canvas.querySelector('.block[data-id="'+id+'"]');
  if(el){ el.classList.add('sel'); el.classList.add('blocksel'); }
  updateDock();
}
function clearBlockSel(){
  if(!blockSel) return;
  var el=canvas.querySelector('.block[data-id="'+blockSel+'"]');
  if(el) el.classList.remove('blocksel');
  blockSel=null;
}
/* Is every character of this line already inside <tag>? Walks the text nodes and
   checks each has <tag> somewhere in its ancestor chain within the line. */
function allWrapped(html,tag){
  var d=document.createElement('div'); d.innerHTML=html||'';
  if(!d.textContent) return false;
  var t=tag.toUpperCase(), ok=true;
  (function walk(node,inside){
    for(var i=0;i<node.childNodes.length;i++){
      var n=node.childNodes[i];
      if(n.nodeType===3){ if(n.nodeValue!=='' && !inside) ok=false; }
      else if(n.nodeType===1) walk(n, inside || n.tagName===t);
    }
  })(d,false);
  return ok;
}
function wrapLine(html,tag){
  var inner=stripTag(html,tag);
  if(inner==='') return '';
  return '<'+tag+'>'+inner+'</'+tag+'>';
}
function stripTag(html,tag){
  var d=document.createElement('div'); d.innerHTML=html||'';
  var t=tag.toUpperCase();
  (function walk(node){
    var kids=[].slice.call(node.childNodes);
    for(var i=0;i<kids.length;i++){
      var n=kids[i];
      if(n.nodeType!==1){ continue; }
      walk(n);
      if(n.tagName===t){ while(n.firstChild) node.insertBefore(n.firstChild,n); node.removeChild(n); }
    }
  })(d);
  return d.innerHTML;
}
function blockFormat(prop){
  var b=findBlock(blockSel||selId); if(!b||b.kind!=='text') return;
  pushUndo();
  if(prop==='bul'){
    var all=true;
    for(var i=0;i<b.lines.length;i++) if(!b.lines[i].bul) all=false;
    for(var j=0;j<b.lines.length;j++) b.lines[j].bul=!all;
  } else {
    var tag=(prop==='b')?'b':(prop==='i')?'i':'u';
    var everyWrapped=true;
    for(var k=0;k<b.lines.length;k++){
      if(lineText(b.lines[k].html).trim()==='') continue;
      if(!allWrapped(b.lines[k].html,tag)) everyWrapped=false;
    }
    for(var m=0;m<b.lines.length;m++){
      if(lineText(b.lines[m].html).trim()==='') continue;
      b.lines[m].html = everyWrapped ? stripTag(b.lines[m].html,tag) : wrapLine(b.lines[m].html,tag);
    }
  }
  save(); render(false);
  /* keep the whole-block selection visible after the change */
  if(blockSel){ var el=canvas.querySelector('.block[data-id="'+blockSel+'"]');
    if(el){ el.classList.add('sel'); el.classList.add('blocksel'); } }
  updateDock();
}

/* ================= the dock ================= */
function updateDock(){
  var b=findBlock(selId);
  var isText=!!(b&&b.kind==='text');
  var ids=['tbFont','tbMinus','tbPlus','tbB','tbI','tbU','tbL'];
  for(var i=0;i<ids.length;i++) document.getElementById(ids[i]).disabled=!isText;
  document.getElementById('tbDel').disabled=!b;
  if(isText){
    document.getElementById('tbFont').value=b.font;
    document.getElementById('tbSize').textContent=b.size;
  } else document.getElementById('tbSize').textContent='\u2013';
  var tx=focusedTx();
  var on=function(c){ try{ return !!(tx&&document.queryCommandState(c)); }catch(e){ return false; } };
  document.getElementById('tbB').classList.toggle('act',on('bold'));
  document.getElementById('tbI').classList.toggle('act',on('italic'));
  document.getElementById('tbU').classList.toggle('act',on('underline'));
  var l=currentLine();
  document.getElementById('tbL').classList.toggle('act',!!(l&&l.bul));
}

/* ================= mouse ================= */
canvas.addEventListener('dblclick',function(e){
  /* create a text box on bare canvas, and also when the double-click lands on the
     hover frame/bands of an IMAGE (you can't type into an image, so the intent is
     clearly to start text near it) */
  if(e.target===canvas){ addBlock(e.offsetX,e.offsetY); return; }
  var onImgChrome=e.target.closest&&e.target.closest('.block[data-kind=image]')&&
                  (e.target.classList.contains('mv')||e.target.classList.contains('frame'));
  if(onImgChrome){
    var cr=canvas.getBoundingClientRect();
    addBlock((e.clientX-cr.left)/scale,(e.clientY-cr.top)/scale);
  }
});
canvas.addEventListener('mousedown',function(e){
  if(e.target===canvas){ dropPoint={x:e.offsetX,y:e.offsetY}; deselect(); return; }
  var blk=e.target.closest?e.target.closest('.block'):null;
  if(!blk) return;
  var b=findBlock(blk.dataset.id); if(!b) return;
  if(blockSel&&blockSel!==b.id) clearBlockSel();

  var hd=e.target.closest('.hd');
  if(hd){ e.preventDefault(); selectBlock(b.id); startResize(e,b,hd.dataset.d); return; }
  if(e.target.classList.contains('mv')||e.altKey){
    e.preventDefault(); selectBlock(b.id); startDrag(e,b); return;
  }
  var tickEl=e.target.closest('.tick');
  if(tickEl){
    e.preventDefault();
    var lid=tickEl.closest('.row').dataset.lid;
    var i=lineIndex(b,lid); if(i<0) return;
    pushUndo();
    b.lines[i].done=!b.lines[i].done;
    if(b.lines[i].done) markAnim(lid);
    selId=b.id; save(); render();
    return;
  }
  if(b.kind==='image'){ e.preventDefault(); selectBlock(b.id); startDrag(e,b); return; }
  selectBlock(b.id);
  if(e.target===blk||e.target.classList.contains('lines')){
    e.preventDefault();
    var last=b.lines[b.lines.length-1];
    focusLine(b.id,last.id,lineText(last.html).length);
  }
});
function startDrag(e,b){
  var sx=e.clientX,sy=e.clientY,ox=b.x,oy=b.y,moved=false;
  var el=canvas.querySelector('.block[data-id="'+b.id+'"]');
  function mv(ev){
    if(!moved){ pushUndo(); moved=true; }
    b.x=Math.round(clamp(ox+(ev.clientX-sx)/scale,0,Math.max(0,canvas.clientWidth-b.w)));
    b.y=Math.round(clamp(oy+(ev.clientY-sy)/scale,0,Math.max(0,canvas.clientHeight-24)));
    el.style.left=b.x+'px'; el.style.top=b.y+'px';
  }
  function up(){ document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up);
    if(moved){ save(); layoutMarks(); } }
  document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up);
}
function startResize(e,b,dir){
  var el=canvas.querySelector('.block[data-id="'+b.id+'"]');
  var sx=e.clientX,sy=e.clientY,moved=false;
  var ox=b.x,oy=b.y,ow=b.w,oh=b.h||Math.round(el.offsetHeight);
  var ratio=ow/Math.max(1,oh), isImg=(b.kind==='image');
  var cw=canvas.clientWidth, ch=canvas.clientHeight;
  var west=dir.indexOf('w')>=0, east=dir.indexOf('e')>=0;
  var north=dir.indexOf('n')>=0, south=dir.indexOf('s')>=0;
  var corner=(west||east)&&(north||south);
  /* the edge that stays put */
  var anchorR=ox+ow, anchorB=oy+oh, anchorX=ox, anchorY=oy;
  function mv(ev){
    if(!moved){ pushUndo(); moved=true; }
    var dx=(ev.clientX-sx)/scale, dy=(ev.clientY-sy)/scale;
    var w=ow,h=oh;
    if(east)  w=ow+dx;
    if(west)  w=ow-dx;
    if(south) h=oh+dy;
    if(north) h=oh-dy;
    w=Math.max(MIN_W,w); h=Math.max(MIN_H,h);

    if(isImg){
      if(corner){
        /* drive off whichever axis the pointer pushed further, then lock the other */
        if(Math.abs(dx)*ratio >= Math.abs(dy)) h=w/ratio; else w=h*ratio;
      } else if(east||west){ h=w/ratio; } else { w=h*ratio; }
      w=Math.max(MIN_W,w); h=w/ratio;   /* re-assert after any clamp */
    }

    /* place against the fixed anchor, then clamp to the page without breaking ratio */
    var x = west ? anchorR - w : anchorX;
    var y = north ? anchorB - h : anchorY;
    if(x<0){ if(isImg){ w=west?anchorR:w; } else { w+=x; } x=0; if(isImg){ h=w/ratio; y=north?anchorB-h:anchorY; } }
    if(y<0){ if(isImg){ h=north?anchorB:h; w=h*ratio; x=west?anchorR-w:anchorX; } else { h+=y; } y=0; }
    if(x+w>cw){ w=cw-x; if(isImg){ h=w/ratio; y=north?anchorB-h:anchorY; if(y<0){ y=0; } } }

    b.x=Math.round(x); b.y=Math.round(y); b.w=Math.round(w); b.h=Math.round(h);
    el.style.left=b.x+'px'; el.style.top=b.y+'px'; el.style.width=b.w+'px';
    if(isImg) el.style.height=b.h+'px'; else el.style.minHeight=b.h+'px';
    layoutMarks();
  }
  function up(){ document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up);
    if(moved){ save(); layoutMarks(); } }
  document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up);
}

/* ================= editing ================= */
canvas.addEventListener('focusin',function(e){
  if(!e.target.classList.contains('tx')) return;
  clearBlockSel();
  var blk=e.target.closest('.block'), row=e.target.closest('.row');
  lastLine={bid:blk.dataset.id,lid:row.dataset.lid};
  if(selId!==blk.dataset.id) selectBlock(blk.dataset.id); else updateDock();
});
canvas.addEventListener('focusout',function(e){
  if(!e.target.classList.contains('tx')) return;
  var blk=e.target.closest('.block'); if(!blk) return;
  var id=blk.dataset.id;
  setTimeout(function(){
    var b=findBlock(id); if(!b||b.kind!=='text') return;
    var el=canvas.querySelector('.block[data-id="'+id+'"]');
    if(el&&el.contains(document.activeElement)) return;
    for(var i=0;i<b.lines.length;i++) if(lineText(b.lines[i].html).trim()!=='') return;
    deleteBlock(id);
  },60);
  setTimeout(updateDock,0);
});
canvas.addEventListener('beforeinput',function(e){
  if(!e.target.classList.contains('tx')) return;
  if(!typing){ pushUndo(); typing=true; }
  clearTimeout(typingT); typingT=setTimeout(function(){typing=false;},900);
});
canvas.addEventListener('input',function(e){
  if(!e.target.classList.contains('tx')) return;
  var blk=e.target.closest('.block'), row=e.target.closest('.row');
  var b=findBlock(blk.dataset.id); if(!b) return;
  var i=lineIndex(b,row.dataset.lid); if(i<0) return;
  b.lines[i].html=sanitize(e.target.innerHTML);
  layoutMarks(row); save(); updateDock();
});
document.addEventListener('selectionchange',function(){
  if(focusedTx()) updateDock();
});

canvas.addEventListener('keydown',function(e){
  var tx=e.target;
  if(!tx.classList||!tx.classList.contains('tx')) return;
  var blk=tx.closest('.block'), row=tx.closest('.row');
  var b=findBlock(blk.dataset.id); if(!b) return;
  var idx=lineIndex(b,row.dataset.lid); if(idx<0) return;
  var l=b.lines[idx], pos=caretPos(tx), txt=lineText(l.html);
  var mod=e.ctrlKey||e.metaKey;

  if(e.key==='Enter'&&mod){
    e.preventDefault(); pushUndo(); l.done=!l.done;
    if(l.done) markAnim(l.id);
    save(); render(); return;
  }
  if(e.key==='Enter'){
    e.preventDefault(); pushUndo(); typing=false;
    var s=window.getSelection(), tail=document.createRange();
    if(s&&s.rangeCount){
      var r=s.getRangeAt(0);
      tail.setStart(r.endContainer,r.endOffset);
      tail.setEnd(tx,tx.childNodes.length);
    } else tail.setStart(tx,tx.childNodes.length), tail.setEnd(tx,tx.childNodes.length);
    var tmp=document.createElement('div');
    tmp.appendChild(tail.extractContents());
    var nl={id:uid(),html:sanitize(tmp.innerHTML),bul:l.bul,done:false};
    l.html=sanitize(tx.innerHTML);
    b.lines.splice(idx+1,0,nl);
    save(); render(false); focusLine(b.id,nl.id,0); return;
  }
  if(e.key==='Backspace'&&pos===0&&collapsed()){
    if(l.bul&&idx>=0){ e.preventDefault(); pushUndo(); l.bul=false; save(); render(); return; }
    if(idx===0){
      if(b.lines.length===1&&txt===''){ e.preventDefault(); pushUndo(); deleteBlock(b.id); }
      return;
    }
    e.preventDefault(); pushUndo(); typing=false;
    var prev=b.lines[idx-1], at=lineText(prev.html).length;
    prev.html=sanitize(prev.html+l.html);
    b.lines.splice(idx,1);
    save(); render(false); focusLine(b.id,prev.id,at); return;
  }
  if(e.key==='Delete'&&pos===txt.length&&collapsed()&&idx<b.lines.length-1){
    e.preventDefault(); pushUndo(); typing=false;
    l.html=sanitize(l.html+b.lines[idx+1].html);
    b.lines.splice(idx+1,1);
    save(); render(false); focusLine(b.id,l.id,pos); return;
  }
  if(e.key==='ArrowUp'&&idx>0&&atEdgeRow(tx,true)){
    e.preventDefault(); focusLine(b.id,b.lines[idx-1].id,lineText(b.lines[idx-1].html).length); return;
  }
  if(e.key==='ArrowDown'&&idx<b.lines.length-1&&atEdgeRow(tx,false)){
    e.preventDefault(); focusLine(b.id,b.lines[idx+1].id,0); return;
  }
  if(mod&&e.key.toLowerCase()==='a'){
    e.preventDefault();
    var full=lineText(l.html);
    /* first Ctrl+A selects the line; a second (line already fully selected, or a
       multi-line block) selects the whole box */
    if(b.lines.length>1 || (blockSel!==b.id && isLineFullySelected(tx))){
      selectWholeBlock(b.id);
    } else {
      var rr=document.createRange(); rr.selectNodeContents(tx);
      var ss=window.getSelection(); ss.removeAllRanges(); ss.addRange(rr);
      updateDock();
    }
    return;
  }
  if(mod&&e.shiftKey&&(e.key==='*'||e.key==='8')){
    e.preventDefault(); pushUndo(); l.bul=!l.bul; save(); render(); return;
  }
  if(mod&&!e.altKey&&!e.shiftKey){
    var k=e.key.toLowerCase();
    if(k==='b'||k==='i'||k==='u'){
      e.preventDefault();
      applyFmt(k==='b'?'bold':(k==='i'?'italic':'underline'));
      return;
    }
  }
  if(e.key==='Escape'){ tx.blur(); deselect(); }
});

function isLineFullySelected(tx){
  var s=window.getSelection();
  if(!s||!s.rangeCount||s.isCollapsed) return false;
  var r=s.getRangeAt(0);
  return r.toString().length>=(tx.textContent||'').length && (tx.textContent||'').length>0;
}
function applyFmt(cmd){
  /* if the whole block is selected, apply to every line */
  if(blockSel){ blockFormat(cmd==='bold'?'b':cmd==='italic'?'i':'u'); return; }
  var tx=focusedTx(); if(!tx) return;
  pushUndo();
  try{ document.execCommand(cmd,false,null); }catch(e){}
  var row=tx.closest('.row'), blk=tx.closest('.block');
  var b=findBlock(blk.dataset.id); if(!b) return;
  var i=lineIndex(b,row.dataset.lid); if(i<0) return;
  b.lines[i].html=sanitize(tx.innerHTML);
  layoutMarks(row); save(); updateDock();
}

/* ================= paste: images and text ================= */
document.addEventListener('paste',function(e){
  var dt=e.clipboardData||window.clipboardData;
  if(!dt) return;
  var file=null, items=dt.items||[];
  for(var i=0;i<items.length;i++){
    if(items[i].kind==='file'&&items[i].type.indexOf('image/')===0){ file=items[i].getAsFile(); break; }
  }
  if(file){ e.preventDefault(); if(!turning) takeImage(file); return; }

  var tx=focusedTx(); if(!tx) return;
  e.preventDefault();
  var t=(dt.getData('text/plain')||'').replace(/\r/g,'');
  var parts=t.split('\n');
  var row=tx.closest('.row'), blk=tx.closest('.block');
  var b=findBlock(blk.dataset.id); if(!b) return;
  var idx=lineIndex(b,row.dataset.lid); if(idx<0) return;
  pushUndo();
  var l=b.lines[idx];
  var sel=window.getSelection();
  if(sel&&sel.rangeCount) sel.getRangeAt(0).deleteContents();
  var head=document.createRange();
  if(sel&&sel.rangeCount){
    var r=sel.getRangeAt(0);
    head.setStart(r.endContainer,r.endOffset); head.setEnd(tx,tx.childNodes.length);
  } else { head.setStart(tx,tx.childNodes.length); head.setEnd(tx,tx.childNodes.length); }
  var tmp=document.createElement('div'); tmp.appendChild(head.extractContents());
  var afterHtml=sanitize(tmp.innerHTML);
  var beforeHtml=sanitize(tx.innerHTML);

  if(parts.length===1){
    l.html=sanitize(beforeHtml+esc(parts[0])+afterHtml);
    save(); render(false); focusLine(b.id,l.id,lineText(beforeHtml+esc(parts[0])).length);
  } else {
    l.html=sanitize(beforeHtml+esc(parts[0]));
    var add=[],lastId=l.id,lastPos=lineText(l.html).length;
    for(var p=1;p<parts.length;p++){
      var h=esc(parts[p]);
      var nl={id:uid(),html:h,bul:l.bul,done:false};
      if(p===parts.length-1){ nl.html=sanitize(h+afterHtml); lastId=nl.id; lastPos=parts[p].length; }
      add.push(nl);
    }
    b.lines.splice.apply(b.lines,[idx+1,0].concat(add));
    save(); render(false); focusLine(b.id,lastId,lastPos);
  }
});

function takeImage(file){
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var s=Math.min(1,IMG_MAX/Math.max(img.width,img.height));
      var cw=Math.max(1,Math.round(img.width*s)), ch=Math.max(1,Math.round(img.height*s));
      var c=document.createElement('canvas'); c.width=cw; c.height=ch;
      var g=c.getContext('2d');
      g.fillStyle='#ffffff'; g.fillRect(0,0,cw,ch);
      g.drawImage(img,0,0,cw,ch);
      var url;
      try{ url=c.toDataURL('image/jpeg',IMG_Q); }catch(err){ say('That image could not be read.'); return; }
      if(docSize()+url.length>SIZE_STOP){
        say('No room for that image. The notebook is near the 1MB sync limit, so delete an image first.');
        return;
      }
      var maxW=Math.min(380,canvas.clientWidth);
      var dw=Math.min(maxW,cw), dh=Math.round(dw*ch/cw);
      pushUndo();
      var b={id:uid(),kind:'image',src:url,
             x:Math.round(clamp(dropPoint.x,0,Math.max(0,canvas.clientWidth-dw))),
             y:Math.round(clamp(dropPoint.y,0,Math.max(0,canvas.clientHeight-dh))),
             w:dw,h:dh,z:++zTop};
      blocks().push(b);
      selId=null;
      save(); render(false);
      if(docSize()>SIZE_WARN) say('Heads up: this notebook is getting close to the 1MB sync limit.');
    };
    img.onerror=function(){ say('That image could not be read.'); };
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}

/* ================= dock wiring ================= */
dock.addEventListener('mousedown',function(e){ if(e.target.tagName!=='SELECT') e.preventDefault(); });
document.getElementById('tbFont').addEventListener('change',function(){
  var b=findBlock(selId); if(!b||b.kind!=='text') return;
  pushUndo(); b.font=this.value; save(); render(); updateDock();
});
function bump(d){
  var b=findBlock(selId); if(!b||b.kind!=='text') return;
  pushUndo(); b.size=clamp(b.size+d,MIN_SIZE,MAX_SIZE); save(); render(); updateDock();
}

document.getElementById('tbPlus').onclick=function(){ bump(1); };

document.getElementById('tbL').onclick=function(){
  var b=findBlock(selId); if(!b||b.kind!=='text') return;
  if(blockSel===b.id){ blockFormat('bul'); return; }
  pushUndo();
  var l=currentLine();
  if(l&&lastLine&&lastLine.bid===b.id) l.bul=!l.bul;
  else{
    var all=true;
    for(var i=0;i<b.lines.length;i++) if(!b.lines[i].bul) all=false;
    for(var j=0;j<b.lines.length;j++) b.lines[j].bul=!all;
  }
  save(); render(); updateDock();
};
document.getElementById('tbDel').onclick=function(){

};

/* ================= navigation & page turn ================= */
/* Paints a static, non-interactive snapshot of a sheet into a leaf face:
   its paper colour on the face, its blocks and marks inside the clone layer. */
function snapshotInto(faceEl,cloneEl,sh){
  faceEl.style.background=paperColor(sh&&sh.paper||'cream');
  cloneEl.innerHTML='';
  var pad=document.createElement('div');
  pad.style.cssText='position:absolute;left:80px;top:30px;right:26px;bottom:28px';
  var bl=(sh&&sh.blocks)||[];
  for(var i=0;i<bl.length;i++){
    var node=renderBlock(bl[i]);
    node.style.pointerEvents='none';
    var junk=node.querySelectorAll('.frame,.mv,.hd');
    for(var j=0;j<junk.length;j++) junk[j].remove();
    var tx=node.querySelectorAll('.tx');
    for(var t=0;t<tx.length;t++) tx[t].contentEditable='false';
    pad.appendChild(node);
  }
  cloneEl.appendChild(pad);
  var rows=pad.querySelectorAll('.row');
  for(var r=0;r<rows.length;r++){
    var row=rows[r]; if(!row.classList.contains('done')) continue;
    var txe=row.querySelector('.tx'), base=row.getBoundingClientRect();
    var rs=lineRects(txe,base); if(!rs.length) continue;
    var fs=parseFloat(getComputedStyle(txe).fontSize)||17, paths='';
    for(var k=0;k<rs.length;k++)
      paths+=strikePaths(rs[k].x1,rs[k].x2,rs[k].y+rs[k].h*0.545,row.dataset.lid+'#'+k,fs,k);
    var svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('class','strike'); svg.innerHTML=paths;
    row.insertBefore(svg,row.firstChild);
    paintNow(svg.querySelectorAll('path'));
    var tk=row.querySelector('.tick');
    if(tk){ var last=rs[rs.length-1], boxs=fs*1.05, ink=boxs*0.128;
      tk.style.display='flex'; tk.style.width=boxs+'px'; tk.style.height=boxs+'px'; tk.style.opacity='1';
      tk.style.left=(last.x2+spaceWidth(txe)+fs*0.20-ink)+'px';
      tk.style.top=(last.y+last.h/2-boxs/2+fs*0.05)+'px';
      paintNow(tk.querySelectorAll('path'));
    }
  }
}

var DUR=520, turnTimer=null;
function turnTo(dir,commit){
  if(turning) return;
  var leaf=document.getElementById('leaf');
  if(reduced()||!leaf.animate){ commit(); afterNav(); return; }
  var zone=document.getElementById('flipzone');
  var lfFront=document.getElementById('lfFront');
  var frontClone=document.getElementById('lfFrontClone');
  var spine=document.getElementById('spineShadow');
  var sheen=lfFront.querySelector('.sheen');

  var fromSheet=sheet();
  turning=true;
  commit();
  var toSheet=sheet();
  /* base page immediately shows the destination; the leaf carries the other page
     and lifts/drops over it. Single opaque face, so no mirrored back can appear. */
  afterNav();

  var startDeg,endDeg;
  if(dir>0){
    /* leaving this page: leaf shows the OLD page, lifts up off the spine and away,
       revealing the NEW page (already on the base) underneath */
    snapshotInto(lfFront,frontClone,fromSheet);
    startDeg=0; endDeg=-105;
  } else {
    /* going back: the previous page drops down from lifted onto the base */
    snapshotInto(lfFront,frontClone,toSheet);
    startDeg=-105; endDeg=0;
  }
  zone.classList.add('on');

  var leafAnim=leaf.animate([
    {transform:'rotateY('+startDeg+'deg)'},
    {transform:'rotateY('+endDeg+'deg)'}
  ],{duration:DUR, easing:'cubic-bezier(.37,.02,.28,1)', fill:'forwards'});

  /* the lifting face darkens along its inner edge as it tilts */
  if(dir>0) sheen.animate([{opacity:0},{opacity:0.9}],{duration:DUR,easing:'ease-in',fill:'forwards'});
  else      sheen.animate([{opacity:0.9},{opacity:0}],{duration:DUR,easing:'ease-out',fill:'forwards'});
  /* shadow pools into the spine while a page stands lifted */
  spine.animate([{opacity:(dir>0)?0:0.55},{opacity:(dir>0)?0.55:0}],
    {duration:DUR,easing:'ease-in-out',fill:'forwards'});

  leafAnim.onfinish=endTurn;
  clearTimeout(turnTimer);
  turnTimer=setTimeout(function(){ if(turning) endTurn(); },DUR+140);
}
function endTurn(){
  clearTimeout(turnTimer);
  document.getElementById('flipzone').classList.remove('on');
  document.getElementById('lfFrontClone').innerHTML='';
  document.getElementById('lfFront').style.background='';
  document.getElementById('spineShadow').style.opacity='0';
  var leaf=document.getElementById('leaf');
  try{ leaf.getAnimations().forEach(function(a){a.cancel();}); }catch(e){}
  leaf.style.transform='';
  turning=false;
}
function afterNav(){
  selId=null; lastLine=null; undoS.length=0; redoS.length=0;
  refreshUndo(); updateDateUI(); render(false);
}
function goDate(iso){
  if(turning) return;
  var dir=(iso>cur)?1:-1;
  turnTo(dir,function(){ prune(); writeLocal(); cur=iso; si=0; });
}
function goPage(n){
  if(turning) return;
  var s=sheets();
  if(n<0||n>=s.length) return;
  var dir=(n>si)?1:-1;
  turnTo(dir,function(){ si=n; });
}
function updateDateUI(){
  document.getElementById('datelabel').textContent=fmtLong(cur);
  document.getElementById('dateinput').value=cur;
  document.getElementById('dot').style.display=(cur===todayISO())?'block':'none';
  var s=sheets();
  si=clamp(si,0,s.length-1);
  document.getElementById('pnum').textContent=(si+1)+' / '+s.length;
  document.getElementById('prevPage').disabled=(si===0);
  document.getElementById('nextPage').disabled=(si>=s.length-1);
}
document.getElementById('prevDay').onclick=function(){ goDate(shiftISO(cur,-1)); };
document.getElementById('nextDay').onclick=function(){ goDate(shiftISO(cur,1)); };
document.getElementById('todayBtn').onclick=function(){ if(cur!==todayISO()) goDate(todayISO()); };
document.getElementById('dateinput').addEventListener('change',function(){
  if(this.value&&this.value!==cur) goDate(this.value);
});
document.getElementById('prevPage').onclick=function(){ goPage(si-1); };
document.getElementById('nextPage').onclick=function(){ goPage(si+1); };
document.getElementById('addPage').onclick=function(){
  if(turning) return;
  var s=sheets();
  s.push({id:uid(),blocks:[]});
  var n=s.length-1;
  turnTo(1,function(){ si=n; save(); });
};
document.getElementById('undoBtn').onclick=undo;

  applyCover();

/* ================= carry forward ================= */
document.getElementById('carry').onclick=function(){
  var dates=[];
  for(var d in pages){
    if(d>=cur) continue;
    var any=false, ss=pages[d].sheets||[];
    for(var s=0;s<ss.length;s++) if(ss[s].blocks.length) any=true;
    if(any) dates.push(d);
  }
  if(!dates.length){ say('No earlier day has anything on it.'); return; }
  dates.sort();
  var src=dates[dates.length-1], carried=[], count=0, ss2=pages[src].sheets;
  for(var s2=0;s2<ss2.length;s2++){
    var sb=ss2[s2].blocks;
    for(var i=0;i<sb.length;i++){
      var b=sb[i];
      if(b.kind!=='text') continue;
      var keep=[];
      for(var j=0;j<b.lines.length;j++){
        var l=b.lines[j];
        if(!l.done&&lineText(l.html).trim()!==''){
          keep.push({id:uid(),html:l.html,bul:l.bul,done:false}); count++;
        }
      }
      if(keep.length) carried.push({id:uid(),kind:'text',x:b.x,y:b.y,w:b.w,h:b.h,
                                    font:b.font,size:b.size,z:++zTop,lines:keep});
    }
  }
  if(!carried.length){ say('Everything on '+fmtShort(src)+' is struck off.'); return; }
  var bl=blocks();
  if(bl.length){
    if(!confirm('Add '+count+' unfinished item'+(count===1?'':'s')+' from '+fmtShort(src)+' to this page?\n\n'+
                'This page already has '+bl.length+' box'+(bl.length===1?'':'es')+' on it.')) return;
    for(var k=0;k<carried.length;k++){
      carried[k].x=clamp(carried[k].x+26,0,Math.max(0,canvas.clientWidth-carried[k].w));
      carried[k].y=clamp(carried[k].y+26,0,Math.max(0,canvas.clientHeight-24));
    }
  }
  pushUndo();
  sheet().blocks=bl.concat(carried);
  save(); render(false);
  say('Carried '+count+' item'+(count===1?'':'s')+' forward from '+fmtShort(src)+'.');
};

/* ================= cloud sync ================= */
var pushT=null,pulling=false,lastPull=0;
function cfg(){ return {key:localStorage.getItem(K_APIKEY)||'',bin:localStorage.getItem(K_BIN)||''}; }
function setStatus(cls,label,title){
  var d=document.getElementById('sdot');
  d.className='sdot'+(cls?' '+cls:'');
  document.getElementById('slabel').textContent=label;
  document.getElementById('syncBtn').title=title||'Cloud sync';
}
function pushSoon(){
  var c=cfg(); if(!c.key||!c.bin) return;
  clearTimeout(pushT); pushT=setTimeout(push,2200);
}
function push(){
  var c=cfg(); if(!c.key||!c.bin) return;
  if(pulling){ clearTimeout(pushT); pushT=setTimeout(push,800); return; }
  setStatus('busy','Saving');
  fetch(API+'/'+c.bin,{method:'PUT',
    headers:{'Content-Type':'application/json','X-Master-Key':c.key,'X-Bin-Versioning':'false'},
    body:JSON.stringify({v:3,pages:pages})})
  .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status);
    setStatus('ok','Synced','Last saved to the cloud just now'); })
  .catch(function(err){
    setStatus('err','Sync error','Could not save: '+err.message+'. Click to check your settings.');
  });
}
function mergePages(remote){
  var changedCur=false,localNewer=false;
  for(var d in remote){
    var rp=remote[d];
    if(!rp||!Array.isArray(rp.sheets)) continue;
    var lp=pages[d];
    if(!lp||(rp.u||0)>(lp.u||0)){ pages[d]=rp; if(d===cur) changedCur=true; }
    else if((lp.u||0)>(rp.u||0)) localNewer=true;
  }
  for(var e in pages) if(!remote[e]) localNewer=true;
  return {changedCur:changedCur,localNewer:localNewer};
}
function pull(quiet){
  var c=cfg();
  if(!c.key||!c.bin){ setStatus('','Sync off','Click to set up syncing across devices'); return; }
  if(pulling) return;
  pulling=true; setStatus('busy','Checking');
  fetch(API+'/'+c.bin+'/latest',{headers:{'X-Master-Key':c.key,'X-Bin-Meta':'false'}})
  .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(function(data){
    var rec=(data&&data.record)?data.record:data;
    var rp=(rec&&rec.pages)?rec.pages:null;
    pulling=false; lastPull=Date.now();
    if(!rp){ setStatus('ok','Synced'); pushSoon(); return; }
    var res=mergePages(rp);
    normalise(); writeLocal();
    setStatus('ok','Synced','In sync with the cloud');
    if(res.changedCur&&!turning){
      undoS.length=0; redoS.length=0; refreshUndo(); updateDateUI(); render(false);
      if(!quiet) say('Updated from your other device.');
    }
    if(res.localNewer) pushSoon();
  })
  .catch(function(err){
    pulling=false;
    setStatus('err','Sync error','Could not load: '+err.message+'. Click to check your settings.');
  });
}
function maybePull(){ if(Date.now()-lastPull>4000&&Date.now()-lastEdit>2500) pull(true); }
window.addEventListener('focus',maybePull);
document.addEventListener('visibilitychange',function(){ if(!document.hidden) maybePull(); });

function openModal(){
  var c=cfg();
  document.getElementById('mkey').value=c.key;
  document.getElementById('mbin').value=c.bin;
  document.getElementById('mNote').textContent=(c.key&&!c.bin)
    ? 'A key is already saved in this browser from your checklist app.':'';
  modal.classList.add('on');
  document.getElementById(c.key?'mbin':'mkey').focus();
}
function closeModal(){ modal.classList.remove('on'); }
document.getElementById('syncBtn').onclick=openModal;
document.getElementById('mCancel').onclick=closeModal;
modal.addEventListener('mousedown',function(e){ if(e.target===modal) closeModal(); });
document.getElementById('mSave').onclick=function(){
  var k=document.getElementById('mkey').value.trim();
  var bn=document.getElementById('mbin').value.trim();
  if(!k||!bn){ document.getElementById('mNote').textContent='Both a master key and a bin ID are needed.'; return; }
  try{ localStorage.setItem(K_APIKEY,k); localStorage.setItem(K_BIN,bn); }catch(e){}
  closeModal(); pull(); say('Cloud sync is on.');
};
document.getElementById('mDisc').onclick=function(){
  try{ localStorage.removeItem(K_BIN); }catch(e){}
  closeModal(); setStatus('','Sync off','Click to set up syncing across devices');
  say('Cloud sync turned off. Your pages are still saved in this browser.');
};
document.getElementById('mkbin').onclick=function(){
  var k=document.getElementById('mkey').value.trim();
  var note=document.getElementById('mNote');
  if(!k){ note.textContent='Paste your master key first.'; return; }
  note.textContent='Creating a bin...';
  fetch(API,{method:'POST',
    headers:{'Content-Type':'application/json','X-Master-Key':k,'X-Bin-Name':'notebook','X-Bin-Private':'true'},
    body:JSON.stringify({v:3,pages:pages})})
  .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(function(d){
    var id=d&&d.metadata&&d.metadata.id;
    if(!id) throw new Error('no bin id returned');
    document.getElementById('mbin').value=id;
    note.textContent='Bin created. Press Save, then paste this bin ID on your other device.';
  })
  .catch(function(err){ note.textContent='Could not create a bin: '+err.message; });
};

/* ================= global ================= */
document.addEventListener('mousedown',function(e){
  if(!selId) return;
  var t=e.target;
  if(t.closest&&(t.closest('.block')||t.closest('.dock')||t.closest('.bar')||t.closest('.modal'))) return;
  deselect();
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&modal.classList.contains('on')){ closeModal(); return; }
  var mod=e.ctrlKey||e.metaKey;
  /* whole-block selection: format every line, or clear on Escape/typing */
  if(blockSel&&!focusedTx()){
    if(e.key==='Escape'){ e.preventDefault(); clearBlockSel(); updateDock(); return; }
    if(mod&&e.shiftKey&&(e.key==='*'||e.key==='8')){ e.preventDefault(); blockFormat('bul'); return; }
    if(mod&&!e.altKey&&!e.shiftKey){
      var kk=e.key.toLowerCase();
      if(kk==='b'||kk==='i'||kk==='u'){ e.preventDefault(); blockFormat(kk); return; }
      if(kk==='a'){ e.preventDefault(); return; } /* already whole-selected */
    }
    if((e.key==='Delete'||e.key==='Backspace')){ e.preventDefault(); pushUndo(); deleteBlock(blockSel); clearBlockSel(); return; }
  }
  if(mod&&e.key.toLowerCase()==='z'){ e.preventDefault(); if(e.shiftKey) redo(); else undo(); return; }
  if(mod&&e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); return; }
  if(e.altKey&&e.key==='ArrowLeft'){ e.preventDefault(); goDate(shiftISO(cur,-1)); return; }
  if(e.altKey&&e.key==='ArrowRight'){ e.preventDefault(); goDate(shiftISO(cur,1)); return; }
  if(e.key==='PageUp'){ e.preventDefault(); goPage(si-1); return; }
  if(e.key==='PageDown'){ e.preventDefault(); goPage(si+1); return; }
  if((e.key==='Delete'||e.key==='Backspace')&&selId&&!focusedTx()&&!modal.classList.contains('on')){
    e.preventDefault(); pushUndo(); deleteBlock(selId);
  }
});
window.addEventListener('resize',fit);
window.addEventListener('beforeunload',function(){ prune(); writeLocal(); });

/* ================= boot ================= */
try{ document.execCommand('styleWithCSS',false,false); }catch(e){}
buildFurniture(); buildSwatches();
load();
try{ zoom=localStorage.getItem(K_ZOOM)==='full'?'full':'fit'; }catch(e){}
try{ cover=localStorage.getItem(K_COVER)||'cardboard'; }catch(e){}
applyCover();
/* one-time: a previous version stored a single paper colour for the whole notebook.
   Seed any colourless sheet with it, then forget the global. */
try{
  var legacy=localStorage.getItem(K_PAPER);
  if(legacy){
    for(var _d in pages){ var _s=pages[_d].sheets||[];
      for(var _i=0;_i<_s.length;_i++) if(!_s[_i].paper) _s[_i].paper=legacy; }
    localStorage.removeItem(K_PAPER);
  }
}catch(e){}
updateDateUI(); refreshUndo(); fit(); render(false);
setStatus('','Sync off','Click to set up syncing across devices');
pull(true);
/* When the webfonts finish loading, text metrics change, so re-render the page and
   re-place every mark against the final font rather than the fallback. */
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){
  render(false); layoutMarks(); relayoutSoon();
});

})();
